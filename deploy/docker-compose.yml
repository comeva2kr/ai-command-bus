# taste-feed 국내 서버 이전 — app + Caddy(자동 HTTPS) + 영속 볼륨.
# 사용: DOMAIN=your.domain docker compose up -d   (또는 .env에 DOMAIN 지정)
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      # 컨테이너 기본은 UTC다. 우리 소스는 대부분 한국 사이트라 "16:09" 처럼
      # 날짜 없는 시:분만 주는 게시판이 많고, 파서는 그걸 "오늘 그 시각"으로
      # 찍는다. 서버가 UTC면 그 값이 실제보다 9시간 앞서 미래가 되고,
      # isSaneDate가 통째로 버린다 — 2026-08-02 검수에서 heraldbiz 11건 전부
      # publishedAt이 null이었던 것과 정합한다(어댑터 주석도 "서버 TZ가 KST여야
      # 정확"이라고 스스로 적어 두었다).
      - TZ=Asia/Seoul
      - PORT=4000
      - FEED_DB=/data/feed.json        # 영속화 (재시작에도 유저 데이터 유지)
      - FEED_LIVE=1
      - FEED_REFRESH_MS=900000         # 15분마다 재수집
      - FEED_TRANSLATE=1               # 해외 소스 한글 번역
      - PUSH_DIGEST_MS=3600000         # 시간당 관심글 digest push
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:comeva2kr@gmail.com}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # 소셜 로그인 — 키가 설정된 provider만 앱에 버튼이 노출된다(auth.js 게이트).
      # 비어 있으면 그 provider는 비활성일 뿐, 앱은 익명으로 정상 동작한다.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}
      # 카카오톡 앱 원탭 로그인용 공개 JavaScript 키(시크릿 아님). 없으면
      # 카카오 로그인은 기존 리다이렉트 방식으로 그대로 동작한다.
      - KAKAO_JS_KEY=${KAKAO_JS_KEY:-}
      # 애드센스 게시자 ID(공개값). 설정 시 index.html에 로더 주입 + /ads.txt 활성.
      - ADSENSE_CLIENT=${ADSENSE_CLIENT:-}
      # GA4 측정 ID ("G-…"). 설정 시 gtag 자동 주입 (미설정 = 미추적).
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-}
      # 카카오 애드핏 모바일 배너 광고단위(공개값). 애드센스 심사 공백 대비.
      - ADFIT_UNIT_MOBILE=${ADFIT_UNIT_MOBILE:-}
      # 쿠팡파트너스 실연동 — 3종 모두 있어야 상품 카드 활성(coupang.js).
      - COUPANG_PARTNER_ID=${COUPANG_PARTNER_ID:-}
      - COUPANG_ACCESS_KEY=${COUPANG_ACCESS_KEY:-}
      - COUPANG_SECRET_KEY=${COUPANG_SECRET_KEY:-}
      - COUPANG_SUB_ID=${COUPANG_SUB_ID:-nowhot}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
    volumes:
      - feed-data:/data
    expose:
      - "4000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  feed-data:
  caddy-data:
  caddy-config:
