<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>안심스캔 설정</title>
<style>
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #111416; color: #f2f3f4; margin: 0; padding: 16px; min-width: 320px; max-width: 520px; }
  h3 { margin: 0 0 4px; }
  .muted { color: #9aa1a8; font-size: 12.5px; }
  .group { margin-top: 14px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .toggles label { border: 1px solid #2c3034; border-radius: 999px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .toggles input { margin: 0 4px 0 0; }
  input[type=text], input[type=url], select { width: 100%; background: #1b1e21; color: inherit; border: 1px solid #2c3034; border-radius: 10px; padding: 8px; margin-top: 4px; }
  button { margin-top: 16px; width: 100%; border: 0; border-radius: 10px; padding: 10px; background: #34c77b; color: #06210f; font-weight: 700; cursor: pointer; }
  #saved { color: #34c77b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <h3>안심스캔 — 아이 정보</h3>
  <div class="muted">이 브라우저에만 저장됩니다. 점수는 확장 안에서 계산해요.</div>
  <div class="group"><span class="muted">나이</span><select id="age"></select></div>
  <div class="group"><span class="muted">알레르기 (선택한 성분이 든 제품은 "먹이지 마세요")</span><div class="toggles" id="allergies"></div></div>
  <div class="group"><span class="muted">걱정되는 것</span><div class="toggles" id="concerns"></div></div>
  <div class="group"><span class="muted">대체품 서버 주소 (선택 — 비우면 내장 예시 카탈로그)</span><input type="url" id="backend" placeholder="http://localhost:4100"></div>
  <button id="save">저장</button>
  <div id="saved"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
