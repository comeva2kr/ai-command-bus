<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 · 지금핫 NowHot</title>
<style>
  :root { --bg:#0e0f13; --card:#171922; --card2:#1e202b; --line:#262a37; --text:#e8eaf0; --muted:#8a90a2;
    --accent:#4f8cff; --danger:#e5566b; --ok:#3fb27f; --warn:#f0a13d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  a { color:var(--accent); }
  button { font:inherit; cursor:pointer; }
  header { display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(14,15,19,.92); backdrop-filter:blur(10px); z-index:10; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:800; }
  header .sp { flex:1; }
  header input { background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:200px; }
  header button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-weight:600; font-size:13px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 22px 60px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
  .tab { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:13.5px; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:8px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat b { display:block; font-size:26px; }
  .stat span { color:var(--muted); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tr:hover td { background:var(--card); }
  .row-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .del { background:var(--danger); color:#fff; border:none; border-radius:8px; padding:6px 11px; font-size:12.5px; }
  .toggle { border:1px solid var(--line); background:var(--card2); color:var(--text); border-radius:8px; padding:6px 11px; font-size:12.5px; }
  .toggle.off { color:var(--danger); border-color:var(--danger); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--card2); color:var(--muted); margin-left:6px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .muted { color:var(--muted); }
  .addword { display:flex; gap:8px; margin-bottom:14px; }
  .addword input { flex:1; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; }
  .addword button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-weight:600; }
  .wordchip { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; margin:0 8px 8px 0; font-size:13px; }
  .wordchip button { background:none; border:none; color:var(--danger); font-size:14px; }
  .gate { max-width:360px; margin:80px auto; text-align:center; }
  .gate input { width:100%; margin:14px 0; }
  .hidden { display:none !important; }
  .empty { color:var(--muted); font-size:13px; padding:20px 0; }
  .country { font-size:11px; color:var(--muted); }
  /* --- 대시보드 패널 --- */
  /* 2026-08-04 행동분석·수익 탭용 — 요약을 먼저, 상세를 뒤에 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:6px; }
  .card { background:var(--card2,#1a1d24); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .k { font-size:12px; color:var(--muted); }
  .card .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
  .card .n { font-size:11px; color:var(--muted); margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .grid2 h4, h4 { font-size:13px; font-weight:650; margin:10px 0 6px; color:var(--muted); }
  /* 넓은 표는 자기 컨테이너 안에서만 가로 스크롤 — 페이지가 옆으로 밀리면 안 된다 */
  table { display:block; overflow-x:auto; max-width:100%; }
  .panel-h { font-size:14px; font-weight:700; margin:24px 0 10px; }
  .panel-h:first-child { margin-top:0; }
  .big b { font-size:34px; }
  .bars { display:flex; align-items:flex-end; gap:5px; padding:12px 4px 0; overflow-x:auto; }
  .bcol { flex:1; min-width:26px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .bpair { display:flex; align-items:flex-end; gap:2px; height:100px; }
  .bar { width:9px; border-radius:3px 3px 0 0; }
  .bar.pv { background:var(--accent); }
  .bar.vis { background:var(--ok); }
  .bar.zero { background:var(--line); height:2px !important; }
  .blab { font-size:10px; color:var(--muted); white-space:nowrap; }
  .legend { display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; }
  .srcline { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .srcline:last-child { border-bottom:none; }
  .srcline .cnt { margin-left:auto; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <h1>🛠 관리자 로그인</h1>
    <p class="muted" style="font-size:13px">관리자 토큰을 입력하세요. (서버 <code>ADMIN_TOKEN</code>)</p>
    <input id="gateToken" type="password" placeholder="admin token" />
    <button onclick="login()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:700">입장</button>
    <p id="gateErr" class="muted" style="color:var(--danger);font-size:12.5px"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>🛠 지금핫 NowHot · 관리자</h1>
      <span class="pill" id="whoami"></span>
      <span class="sp"></span>
      <a href="/" style="font-size:13px">← 서비스로</a>
      <button onclick="logout()" style="background:var(--card2);border:1px solid var(--line);color:var(--text)">로그아웃</button>
    </header>
    <div class="wrap">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </div>

<script>
const TABS = [
  ["dashboard","대시보드"], ["analytics","행동 분석"], ["finance","수익·지출"],
  ["communities","커뮤니티"], ["posts","게시글"],
  ["comments","댓글"], ["words","금지어"], ["users","사용자"], ["blueprint","개발관리"]
];
// 개발관리 페이지 — David 고정법칙(2026-08-04): 블루프린트를 일회성 문서가
// 아니라 살아 있는 개발관리 페이지로 쓰고, 관리자에서 바로 열 수 있어야 한다.
const BLUEPRINT_URL = "https://claude.ai/code/artifact/8b9e7c06-306c-4dc6-ae70-0022db898419";
let token = localStorage.getItem("admin_token") || "";
let active = "dashboard";

async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: { "content-type":"application/json", "x-admin-token": token, ...(opts.headers||{}) } });
  if (res.status === 401) { logout(); throw new Error("인증 실패"); }
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.status);
  return res.json();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function when(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("ko-KR"); }

async function login(){
  token = document.getElementById("gateToken").value.trim();
  try { await api("/api/admin/stats"); localStorage.setItem("admin_token", token); boot(); }
  catch(e){ document.getElementById("gateErr").textContent = "토큰이 올바르지 않습니다."; }
}
function logout(){ localStorage.removeItem("admin_token"); token=""; document.getElementById("app").classList.add("hidden"); document.getElementById("gate").classList.remove("hidden"); }

function boot(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  const tabsEl = document.getElementById("tabs"); tabsEl.innerHTML="";
  for (const [id,label] of TABS){
    const b=document.createElement("button"); b.className="tab"+(id===active?" active":""); b.textContent=label;
    b.onclick=()=>{ active=id; boot(); }; tabsEl.appendChild(b);
  }
  render();
}

async function render(){
  const panel=document.getElementById("panel"); panel.innerHTML='<p class="empty">불러오는 중…</p>';
  try {
    if (active==="dashboard") return renderDashboard(panel);
    if (active==="analytics") return renderAnalytics(panel);
    if (active==="finance") return renderFinance(panel);
    if (active==="blueprint") return renderBlueprint(panel);
    if (active==="communities") return renderCommunities(panel);
    if (active==="posts") return renderPosts(panel);
    if (active==="comments") return renderComments(panel);
    if (active==="words") return renderWords(panel);
    if (active==="users") return renderUsers(panel);
  } catch(e){ panel.innerHTML='<p class="empty" style="color:var(--danger)">'+esc(e.message)+'</p>'; }
}


// ── 행동 분석 ───────────────────────────────────────────────────────────────
let anGran = "day";
function pct(v){ return v==null ? "—" : (v*100).toFixed(2)+"%"; }
function num(v){ return v==null ? "—" : Number(v).toLocaleString("ko-KR"); }
function sec(v){ return v==null ? "—" : (v>=60 ? Math.floor(v/60)+"분 "+(v%60)+"초" : v+"초"); }

function kvTable(rows, headers){
  if(!rows || !rows.length) return '<p class="empty">아직 기록이 없어요</p>';
  const max = Math.max(...rows.map(r=>r.count||0), 1);
  return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.key)+'</td><td style="text-align:right;font-variant-numeric:tabular-nums">'+num(r.count)+
      '</td><td style="width:38%"><div style="background:var(--accent);height:8px;border-radius:4px;width:'+
      Math.round((r.count/max)*100)+'%"></div></td></tr>').join('')+'</tbody></table>';
}
function adTable(rows){
  if(!rows || !rows.length) return '<p class="empty">아직 노출 기록이 없어요</p>';
  return '<table><thead><tr><th>슬롯 / 문구</th><th>노출</th><th>클릭</th><th>CTR</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.key)+'</td><td>'+num(r.imp)+'</td><td>'+num(r.click)+'</td><td>'+pct(r.ctr)+'</td></tr>').join('')+
    '</tbody></table>';
}

async function renderAnalytics(panel){
  const res = await api("/api/admin/analytics?granularity="+anGran+"&limit=30");
  const rows = res.rows || [];
  const L = res.latest;
  const gbtn = (id,label)=>'<button class="tab'+(anGran===id?" active":"")+'" onclick="anGran=\''+id+'\';render()">'+label+'</button>';
  if(!rows.length){
    panel.innerHTML = '<div class="panel-h">📊 행동 분석</div><p class="empty">아직 수집된 이벤트가 없어요. 방문이 발생하면 여기에 쌓입니다.</p>';
    return;
  }
  panel.innerHTML = `
    <div class="panel-h">📊 행동 분석 <span style="float:right">${gbtn("day","일별")} ${gbtn("week","주별")} ${gbtn("month","월별")}</span></div>
    <table>
      <thead><tr><th>기간</th><th>방문자</th><th>신규</th><th>재방문</th><th>PV</th><th>1인당 PV</th><th>평균 체류</th><th>평균 깊이</th><th>글 클릭</th><th>광고 노출</th><th>광고 클릭</th><th>CTR</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>`<tr>
        <td>${esc(r.label||r.key)}</td><td>${num(r.visitors)}</td><td>${num(r.newVisitors)}</td><td>${num(r.returning)}</td>
        <td>${num(r.pv)}</td><td>${r.pvPerVisitor==null?"—":r.pvPerVisitor}</td>
        <td>${sec(r.avgDwellSec)}${r.dwellSamples?'<span class="pill" style="margin-left:4px">'+r.dwellSamples+'건</span>':''}</td>
        <td>${r.avgDepth==null?"—":r.avgDepth}</td>
        <td>${num(r.contentClicks)}</td><td>${num(r.adImpressions)}</td><td>${num(r.adClicks)}</td><td>${pct(r.adCtr)}</td>
      </tr>`).join("")}</tbody>
    </table>
    <p class="empty" style="text-align:left">평균 체류·깊이 옆의 건수는 그 평균이 몇 건의 표본에서 나왔는지입니다. 표본이 없으면 0이 아니라 —로 표시합니다.</p>

    <div class="panel-h">🪪 방문자를 무엇으로 알아봤나 (최근 ${esc(L.label||L.key)})</div>
    <div class="cards">
      <div class="card"><div class="k">복구된 세션</div><div class="v">${num(L.identityRecovered)}</div><div class="n">로그인·기기 쿠키로 같은 사람으로 이어짐</div></div>
      <div class="card"><div class="k">새로 발급</div><div class="v">${num(L.identityNew)}</div><div class="n">단서가 없어 새 사람으로 잡힘</div></div>
    </div>
    ${kvTable(L.identity, ["판별 경로","세션","비중"])}
    <p class="empty" style="text-align:left">GA4와 같은 순서로 확정합니다 — <b>로그인 → 기기 쿠키 → 브라우저 저장소 → 신규</b>.
    "새로 발급"이 압도적이면 쿠키가 안 남고 있다는 뜻이라 재방문 수치를 믿으면 안 됩니다.
    앱 내장 브라우저(카카오톡·네이버)는 저장소를 자주 비우지만 쿠키는 살아남습니다.</p>

    <div class="panel-h">🚪 어디에서 들어오나</div>
    ${kvTable(L.referrers, ["유입 출처","방문","비중"])}

    <div class="panel-h">📣 대외 광고 캠페인 (utm)</div>
    ${L.campaigns && L.campaigns.length ? kvTable(L.campaigns, ["source | medium | campaign","유입","비중"])
      : '<p class="empty">캠페인 유입이 아직 없어요. 외부에 링크를 뿌릴 때 <code>?utm_source=naver_blog&utm_medium=post&utm_campaign=0804</code> 같은 파라미터를 붙이면 여기서 채널별 성과가 갈립니다.</p>'}

    <div class="panel-h">🧭 어느 화면으로 들어와서 어디서 나가나</div>
    <div class="grid2">
      <div><h4>진입 화면</h4>${kvTable(L.entries, ["화면","진입","비중"])}</div>
      <div><h4>이탈 화면</h4>${kvTable(L.exits, ["화면","이탈","비중"])}</div>
    </div>

    <div class="panel-h">👆 무엇을 누르나</div>
    <div class="grid2">
      <div><h4>소스별 클릭</h4>${kvTable(L.clickSources, ["소스","클릭","비중"])}</div>
      <div><h4>카테고리별 클릭</h4>${kvTable(L.clickCategories, ["카테고리","클릭","비중"])}</div>
    </div>
    <h4>순위대별 클릭 — 첫 화면에서 눌리나, 내려가서 눌리나</h4>
    ${kvTable(L.clickRanks, ["순위대","클릭","비중"])}

    <div class="panel-h">💰 광고 성과</div>
    <div class="grid2">
      <div><h4>슬롯별</h4>${adTable(L.adSlots)}</div>
      <div><h4>문구(variant)별</h4>${adTable(L.adVariants)}</div>
    </div>`;
}

// ── 수익·지출 ───────────────────────────────────────────────────────────────
let finMonth = null;
async function renderFinance(panel){
  const q = finMonth ? "?month="+encodeURIComponent(finMonth) : "";
  const res = await api("/api/admin/finance"+q);
  finMonth = res.month;
  const { usage, pl, fixed } = res;
  const won = (v)=> v==null ? "—" : Math.round(v).toLocaleString("ko-KR")+"원";
  const purposes = Object.entries(usage.byPurpose||{}).sort((a,b)=>b[1].usd-a[1].usd);
  const models = Object.entries(usage.byModel||{}).sort((a,b)=>b[1].usd-a[1].usd);
  panel.innerHTML = `
    <div class="panel-h">💵 ${esc(finMonth)} 손익</div>
    <div class="cards">
      <div class="card"><div class="k">매출</div><div class="v">${pl.revenueKrw==null?'<span style="color:var(--muted)">미입력</span>':won(pl.revenueKrw)}</div><div class="n">쿠팡 정산액 — 직접 입력</div></div>
      <div class="card"><div class="k">API 실비</div><div class="v">${won(pl.variableKrw)}</div><div class="n">$${pl.variableUsd.toFixed(4)} · 토큰×공개단가 실측</div></div>
      <div class="card"><div class="k">고정비</div><div class="v">${pl.fixedMissingMonths.length?'<span style="color:var(--warn,#e0a54b)">미입력</span>':won(pl.fixedKrw)}</div><div class="n">VM·도메인 등</div></div>
      <div class="card"><div class="k">총 지출</div><div class="v">${won(pl.totalKrw)}</div><div class="n">실비 + 고정비</div></div>
      <div class="card"><div class="k">순이익</div><div class="v">${pl.netKrw==null?'<span style="color:var(--muted)">계산 불가</span>':won(pl.netKrw)}</div><div class="n">${pl.netKrw==null?"매출을 넣어야 계산됩니다":"매출 − 총 지출"}</div></div>
    </div>
    ${pl.unpricedCalls ? '<p class="empty" style="text-align:left;color:var(--warn,#e0a54b)">단가가 등록되지 않은 모델 호출 '+pl.unpricedCalls+'건이 비용에서 빠져 있습니다 (costs.js MODEL_PRICING에 추가 필요).</p>' : ''}
    <p class="empty" style="text-align:left">원화는 참고 환산입니다(1달러 ${pl.usdKrwReference}원 기준). 원장은 달러로 남습니다.</p>

    <div class="panel-h">🤖 API 호출 (${esc(finMonth)} 실측)</div>
    <div class="cards">
      <div class="card"><div class="k">호출 수</div><div class="v">${num(usage.calls)}</div></div>
      <div class="card"><div class="k">입력 토큰</div><div class="v">${num(usage.inputTokens)}</div></div>
      <div class="card"><div class="k">출력 토큰</div><div class="v">${num(usage.outputTokens)}</div></div>
    </div>
    <h4>용도별</h4>
    ${purposes.length ? '<table><thead><tr><th>용도</th><th>호출</th><th>비용(USD)</th></tr></thead><tbody>'+
      purposes.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+num(v.calls)+'</td><td>$'+v.usd.toFixed(4)+'</td></tr>').join('')+'</tbody></table>'
      : '<p class="empty">이번 달 API 호출 기록이 없어요</p>'}
    <h4>모델별</h4>
    ${models.length ? '<table><thead><tr><th>모델</th><th>호출</th><th>입력</th><th>출력</th><th>비용(USD)</th></tr></thead><tbody>'+
      models.map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+num(v.calls)+'</td><td>'+num(v.inputTokens)+'</td><td>'+num(v.outputTokens)+'</td><td>$'+v.usd.toFixed(4)+'</td></tr>').join('')+'</tbody></table>'
      : ''}

    <div class="panel-h">✍️ 입력 — 매출과 고정비</div>
    <p class="empty" style="text-align:left">쿠팡 정산액과 VM·도메인 비용은 우리가 자동으로 읽을 수 없어요. 여기 넣은 값만 손익에 반영되고, 넣기 전에는 0이 아니라 "미입력"으로 남습니다.</p>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:520px">
      <label>월 <input id="finM" value="${esc(finMonth)}" style="width:110px"></label>
      <label>매출(원) <input id="finRev" type="number" value="${pl.revenueKrw==null?"":pl.revenueKrw}" placeholder="쿠팡 정산액"></label>
      <div id="fixedRows">${(fixed&&fixed.length?fixed:[{label:"VM",krw:""},{label:"도메인",krw:""}])
        .map((e,i)=>'<div style="display:flex;gap:6px;margin-bottom:4px"><input class="fxL" value="'+esc(e.label)+'" placeholder="항목" style="flex:1"><input class="fxK" type="number" value="'+(e.krw||"")+'" placeholder="월 금액(원)" style="width:150px"></div>').join("")}</div>
      <div style="display:flex;gap:6px">
        <button onclick="addFixedRow()" style="background:var(--card2);border:1px solid var(--line);color:var(--text)">＋ 항목 추가</button>
        <button onclick="saveFinance()">저장</button>
      </div>
      <span id="finMsg" class="pill"></span>
    </div>`;
}
function addFixedRow(){
  const d=document.createElement("div");
  d.style.cssText="display:flex;gap:6px;margin-bottom:4px";
  d.innerHTML='<input class="fxL" placeholder="항목" style="flex:1"><input class="fxK" type="number" placeholder="월 금액(원)" style="width:150px">';
  document.getElementById("fixedRows").appendChild(d);
}
async function saveFinance(){
  const month=document.getElementById("finM").value.trim();
  const rev=document.getElementById("finRev").value;
  const labels=[...document.querySelectorAll(".fxL")].map(i=>i.value.trim());
  const krws=[...document.querySelectorAll(".fxK")].map(i=>i.value);
  const fixed=labels.map((label,i)=>({label,krw:Number(krws[i])||0})).filter(e=>e.label);
  try{
    await api("/api/admin/finance",{method:"POST",body:JSON.stringify({month,fixed,revenueKrw:rev===""?null:Number(rev)})});
    document.getElementById("finMsg").textContent="저장했어요";
    finMonth=month; render();
  }catch(e){ document.getElementById("finMsg").textContent="저장 실패: "+e.message; }
}

  // 병렬 로드: 통계(+광고), 트래픽 14일, 소스 헬스, 공개 설정(수익 채널 여부)

    <div class="stats">
      <div class="stat"><b>${stats.users}</b><span>사용자</span></div>
      <div class="stat"><b>${stats.posts}</b><span>게시글</span></div>

    <div class="row-card"><b>추가 금지어</b> ${stats.bannedWords.length?stats.bannedWords.map(w=>`<span class="pill">${esc(w)}</span>`).join(""):'<span class="muted">없음</span>'}</div>`;

// 트래픽 패널: 오늘 수치 크게 + 순수 CSS 막대(14일). 실측만 — 없으면 "데이터 없음".
function trafficHtml(days){
  if (!Array.isArray(days)) return '<p class="empty">데이터 없음 — 트래픽 API를 불러오지 못했습니다.</p>';
  if (!days.length) return '<p class="empty">데이터 없음 — 아직 집계된 트래픽이 없습니다.</p>';
  const todayKey = new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); // KST
  const today = days.find(d=>d.date===todayKey) || { pv:0, feed:0, visitors:0 };
  const max = Math.max(1, ...days.map(d=>Math.max(d.pv, d.visitors)));
  const barH = v => Math.max(3, Math.round(v/max*100));
  const cols = days.map(d=>`
    <div class="bcol" title="${esc(d.date)} · 방문자 ${d.visitors} · PV ${d.pv} · 피드요청 ${d.feed}">
      <div class="bpair">
        <div class="bar vis${d.visitors?'':' zero'}" style="height:${d.visitors?barH(d.visitors):2}px"></div>
        <div class="bar pv${d.pv?'':' zero'}" style="height:${d.pv?barH(d.pv):2}px"></div>
      </div>
      <div class="blab">${esc(d.date.slice(5).replace("-","/"))}</div>
    </div>`).join("");
  return `
    <div class="stats">
      <div class="stat big"><b>${today.visitors}</b><span>오늘 방문자 (${esc(todayKey)})</span></div>
      <div class="stat big"><b>${today.pv}</b><span>오늘 페이지뷰</span></div>
      <div class="stat"><b>${today.feed}</b><span>오늘 피드 요청</span></div>
    </div>
    <div class="row-card">
      <div class="bars">${cols}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>방문자</span><span><i style="background:var(--accent)"></i>페이지뷰</span></div>
    </div>`;
}

// 수익 패널: 광고 노출/클릭 실측 + 채널 활성 여부 (/api/config monetization·adfit)
function revenueHtml(ads, config){
  const adStats = ads
    ? `<div class="stats">
        <div class="stat"><b>${ads.impressions}</b><span>광고 노출</span></div>
        <div class="stat"><b>${ads.clicks}</b><span>광고 클릭</span></div>
        <div class="stat"><b>${ads.impressions?(ads.ctr*100).toFixed(2)+"%":"—"}</b><span>CTR${ads.impressions?"":" (노출 없음)"}</span></div>
      </div>`
    : '<p class="empty">데이터 없음 — 광고 지표를 불러오지 못했습니다.</p>';
  let channels;
  if (config) {
    const ch = (label, on, note) => `<div class="srcline"><span class="dot" style="background:${on?"var(--ok)":"var(--line)"}"></span>${esc(label)}<span class="cnt ${on?"":"muted"}">${on?"활성":"미설정"}${note?` · ${esc(note)}`:""}</span></div>`;
    channels = `<div class="row-card">
      ${ch("제휴/광고 슬롯 (monetization)", config.monetization && config.monetization.enabled)}
      ${ch("카카오 애드핏 배너", config.adfit && config.adfit.mobileUnit, config.adfit && config.adfit.mobileUnit ? config.adfit.mobileUnit : "")}
    </div>`;
  } else {
    channels = '<p class="empty">데이터 없음 — 채널 설정(/api/config)을 불러오지 못했습니다.</p>';
  }
  return adStats + channels;
}

// 소스 헬스 패널: 수집 풀 실측 건수 — 0건 라이브 소스는 빨간 표시
function sourceHealthHtml(sources){
  if (!Array.isArray(sources)) return '<p class="empty">데이터 없음 — 소스 헬스 API를 불러오지 못했습니다.</p>';
  const live = sources.filter(s=>s.enabled && !s.seed);
  if (!live.length) return '<p class="empty">데이터 없음 — 등록된 라이브 소스가 없습니다.</p>';
  live.sort((a,b)=>a.liveCount-b.liveCount || String(a.label).localeCompare(String(b.label),"ko"));
  const dead = live.filter(s=>!s.disabled && s.liveCount===0).length;
  const rows = live.map(s=>{
    const color = s.disabled ? "var(--muted)" : (s.liveCount===0 ? "var(--danger)" : "var(--ok)");
    const cnt = s.disabled
      ? '<span class="cnt muted">비활성</span>'
      : (s.liveCount===0
        ? '<span class="cnt" style="color:var(--danger);font-weight:700">0건</span>'
        : `<span class="cnt">${s.liveCount}건</span>`);
    return `<div class="srcline"><span class="dot" style="background:${color}"></span>${esc(s.label)} <span class="country">${esc(s.category)}·${esc(s.kind)}</span>${cnt}</div>`;
  }).join("");
  return `<div class="row-card">
    <div class="muted" style="font-size:12.5px;margin-bottom:6px">라이브 소스 ${live.length}곳 · <span style="color:${dead?"var(--danger)":"var(--ok)"}">수집 0건 ${dead}곳</span> — 수치는 현재 수집 풀 실측입니다. 개별 점검은 커뮤니티 탭의 🩺 수집 점검.</div>
    ${rows}
  </div>`;
}

async function renderCommunities(panel){
  const { communities } = await api("/api/admin/communities");
  const colors={};
  const rows = communities.map(c=>`<tr>
    <td><b>${esc(c.label)}</b> <span class="country">${esc(c.country)}·${esc(c.lang)}${c.adult?" · 🔞":""}</span></td>
    <td class="muted">${esc(c.category)} / ${esc(c.kind)} / ${esc(c.size||"")}</td>
    <td>${c.enabled?'<span style="color:var(--ok)">등록</span>':'<span class="muted">비등록</span>'}</td>
    <td><button class="toggle ${c.disabled?'off':''}" onclick="toggleCommunity('${esc(c.id)}',${!c.disabled})">${c.disabled?'비활성(켜기)':'활성(끄기)'}</button></td>
  </tr>`).join("");
  panel.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <p class="muted" style="font-size:12.5px;margin:0;flex:1">전역으로 끄면 모든 사용자 피드에서 해당 커뮤니티가 사라집니다.</p>
      <button id="checkSrc" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600">🩺 수집 점검</button>
    </div>
    <div id="checkResult" style="margin-bottom:10px"></div>
    <table><thead><tr><th>커뮤니티</th><th>분류</th><th>수집</th><th>노출</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById("checkSrc").onclick = async ()=>{
    const box = document.getElementById("checkResult");
    box.innerHTML = '<span class="muted" style="font-size:12.5px">실제 피드에 접속해 확인하는 중…</span>';
    try {
      const { results } = await api("/api/admin/check-sources", { method:"POST", body:"{}" });
      if(!results.length){ box.innerHTML = '<span class="muted">점검할 라이브 소스가 없습니다.</span>'; return; }
      box.innerHTML = results.map(r => r.ok
        ? `<div class="row-card" style="border-color:var(--ok)">✅ <b>${esc(r.label)}</b> — ${r.items}개 수신 (${r.ms}ms)</div>`
        : `<div class="row-card" style="border-color:var(--danger)">❌ <b>${esc(r.label)}</b> — ${esc(r.error)} <span class="muted">(${r.ms}ms)</span></div>`
      ).join("");
    } catch(e){ box.innerHTML = '<span style="color:var(--danger);font-size:12.5px">점검 실패: '+esc(e.message)+'</span>'; }
  };
}
async function toggleCommunity(id, disabled){
  await api("/api/admin/community",{method:"POST",body:JSON.stringify({id,disabled})}); render();
}

async function renderPosts(panel){
  const { posts } = await api("/api/admin/posts");
  if(!posts.length){ panel.innerHTML='<p class="empty">사용자 게시글이 없습니다.</p>'; return; }
  panel.innerHTML = posts.map(p=>`<div class="row-card">
    <div class="muted" style="font-size:12px">${esc(p.category)} · ${esc(p.userId)} · ${when(p.publishedAt)}</div>
    <div style="font-weight:600;margin:4px 0">${esc(p.title)}</div>
    <div class="muted" style="font-size:13px">${esc((p.summary||"").slice(0,140))}</div>
    <div style="margin-top:8px"><button class="del" onclick="delPost('${esc(p.id)}')">삭제</button></div>
  </div>`).join("");
}
async function delPost(id){ if(!confirm("이 게시글을 삭제할까요?"))return; await api("/api/admin/delete-post",{method:"POST",body:JSON.stringify({id})}); render(); }

async function renderComments(panel){
  const { comments } = await api("/api/admin/comments");
  if(!comments.length){ panel.innerHTML='<p class="empty">댓글이 없습니다.</p>'; return; }
  panel.innerHTML = comments.map(c=>`<div class="row-card">
    <div class="muted" style="font-size:12px">${esc(c.userId)} · ${when(c.at)} · 글 ${esc(c.itemId)}</div>
    <div style="margin:4px 0">${esc(c.body)}</div>
    <button class="del" onclick="delComment('${esc(c.id)}')">삭제</button>
  </div>`).join("");
}
async function delComment(id){ if(!confirm("이 댓글을 삭제할까요?"))return; await api("/api/admin/delete-comment",{method:"POST",body:JSON.stringify({id})}); render(); }

async function renderWords(panel){
  const { stats } = await api("/api/admin/stats");
  const chips = stats.bannedWords.map(w=>`<span class="wordchip">${esc(w)} <button onclick="rmWord('${esc(w)}')">✕</button></span>`).join("") || '<span class="muted">추가된 금지어가 없습니다.</span>';
  panel.innerHTML = `<div class="addword"><input id="newWord" placeholder="금지어 입력" onkeydown="if(event.key==='Enter')addWord()"><button onclick="addWord()">추가</button></div><div>${chips}</div>
    <p class="muted" style="font-size:12.5px;margin-top:12px">기본 금지어에 더해 적용됩니다. 게시글·댓글에 포함되면 등록이 거부됩니다.</p>`;
}
async function addWord(){ const w=document.getElementById("newWord").value.trim(); if(!w)return; await api("/api/admin/banned-word",{method:"POST",body:JSON.stringify({word:w,action:"add"})}); render(); }
async function rmWord(w){ await api("/api/admin/banned-word",{method:"POST",body:JSON.stringify({word:w,action:"remove"})}); render(); }

async function renderUsers(panel){
  const { users } = await api("/api/admin/users");
  if(!users.length){ panel.innerHTML='<p class="empty">사용자가 없습니다.</p>'; return; }
  const rows = users.map(u=>`<tr>
    <td>${esc(u.id)}</td><td>${u.surveyed?"✓":"—"}</td><td>${u.posts}</td><td>${u.comments}</td>
    <td>${u.feedbackCount}</td><td>${u.ageVerified?"🔞":"—"}</td><td class="muted">${when(u.createdAt)}</td>
  </tr>`).join("");
  panel.innerHTML = `<table><thead><tr><th>ID</th><th>설문</th><th>글</th><th>댓글</th><th>피드백</th><th>성인</th><th>가입</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// boot
if (token) { api("/api/admin/stats").then(boot).catch(logout); }
</script>
