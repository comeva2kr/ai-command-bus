<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 · 지금핫 NowHot</title>
<style>
  :root { --bg:#0e0f13; --card:#171922; --card2:#1e202b; --line:#262a37; --text:#e8eaf0; --muted:#8a90a2;
    --accent:#4f8cff; --danger:#e5566b; --ok:#3fb27f; --warn:#f0a13d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif; }
  a { color:var(--accent); }
  button { font:inherit; cursor:pointer; }
  header { display:flex; align-items:center; gap:12px; padding:16px 22px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(14,15,19,.92); backdrop-filter:blur(10px); z-index:10; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:800; }
  header .sp { flex:1; }
  header input { background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; width:200px; }
  header button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-weight:600; font-size:13px; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 22px 60px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; }
  .tab { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:13.5px; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:8px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat b { display:block; font-size:26px; }
  .stat span { color:var(--muted); font-size:12.5px; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  tr:hover td { background:var(--card); }
  .row-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .del { background:var(--danger); color:#fff; border:none; border-radius:8px; padding:6px 11px; font-size:12.5px; }
  .toggle { border:1px solid var(--line); background:var(--card2); color:var(--text); border-radius:8px; padding:6px 11px; font-size:12.5px; }
  .toggle.off { color:var(--danger); border-color:var(--danger); }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--card2); color:var(--muted); margin-left:6px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .muted { color:var(--muted); }
  .addword { display:flex; gap:8px; margin-bottom:14px; }
  .addword input { flex:1; background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 11px; }
  .addword button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-weight:600; }
  .wordchip { display:inline-flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px; margin:0 8px 8px 0; font-size:13px; }
  .wordchip button { background:none; border:none; color:var(--danger); font-size:14px; }
  .gate { max-width:360px; margin:80px auto; text-align:center; }
  .gate input { width:100%; margin:14px 0; }
  .hidden { display:none !important; }
  .empty { color:var(--muted); font-size:13px; padding:20px 0; }
  .country { font-size:11px; color:var(--muted); }
  /* --- 대시보드 패널 --- */
  /* 2026-08-04 행동분석·수익 탭용 — 요약을 먼저, 상세를 뒤에 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:6px; }
  .card { background:var(--card2,#1a1d24); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .k { font-size:12px; color:var(--muted); }
  .card .v { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
  .card .n { font-size:11px; color:var(--muted); margin-top:2px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .grid2 h4, h4 { font-size:13px; font-weight:650; margin:10px 0 6px; color:var(--muted); }
  /* 넓은 표는 자기 컨테이너 안에서만 가로 스크롤 — 페이지가 옆으로 밀리면 안 된다 */
  table { display:block; overflow-x:auto; max-width:100%; }
  .panel-h { font-size:14px; font-weight:700; margin:24px 0 10px; }
  .panel-h:first-child { margin-top:0; }
  .big b { font-size:34px; }
  .bars { display:flex; align-items:flex-end; gap:5px; padding:12px 4px 0; overflow-x:auto; }
  .bcol { flex:1; min-width:26px; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .bpair { display:flex; align-items:flex-end; gap:2px; height:100px; }
  .bar { width:9px; border-radius:3px 3px 0 0; }
  .bar.pv { background:var(--accent); }
  .bar.vis { background:var(--ok); }
  .bar.hum { background:var(--warn); }
  /* 날짜 선택기 (네이버 광고관리식: 프리셋 칩 + 직접 기간 + 일/주/월) —
     대시보드·행동분석이 같은 상태를 공유한다(localStorage) */
  .rangebar { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:14px; }
  .rchip { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:12.5px; }
  .rchip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rangebar input[type=date] { background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:6px 8px; font-size:12.5px; -webkit-appearance:none; appearance:none; min-height:32px; }
  .rangebar .gsep { width:1px; height:22px; background:var(--line); margin:0 4px; }
  .tblwrap { overflow-x:auto; max-width:100%; }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .delta { font-size:12px; margin-left:6px; }
  .delta.up { color:var(--ok); } .delta.down { color:var(--danger); }
  .pipe { font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:8px; vertical-align:middle; font-weight:400; }
  .bar.zero { background:var(--line); height:2px !important; }
  .blab { font-size:10px; color:var(--muted); white-space:nowrap; }
  .legend { display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:8px; }
  .legend i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; }
  .srcline { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .srcline:last-child { border-bottom:none; }
  .srcline .cnt { margin-left:auto; font-variant-numeric:tabular-nums; }
  /* --- 개발관리: 제품헌장과 시스템 블루프린트의 읽기 전용 투영 --- */
  .dev-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:start;
    padding:2px 0 20px; border-bottom:1px solid var(--line); }
  .dev-head h2 { margin:3px 0 8px; font-size:22px; line-height:1.25; }
  .dev-kicker { color:var(--accent); font-size:11px; font-weight:800; text-transform:uppercase; }
  .dev-summary { color:var(--muted); font-size:13px; line-height:1.65; max-width:760px; }
  .dev-state { min-width:210px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .dev-state strong { display:block; font-size:14px; margin-bottom:5px; }
  .dev-state span { display:block; color:var(--muted); font-size:11.5px; line-height:1.5; }
  .dev-alert { display:flex; flex-wrap:wrap; gap:9px; align-items:center; margin:14px 0 0; padding:10px 12px;
    border-left:3px solid var(--warn); background:color-mix(in srgb,var(--warn) 9%,var(--card)); font-size:12.5px; }
  .dev-alert b { color:var(--warn); }
  .dev-jump { display:flex; flex-wrap:wrap; gap:4px; margin:14px 0 0; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .dev-jump a { color:var(--muted); text-decoration:none; padding:6px 10px; font-size:12px; border-bottom:2px solid transparent; }
  .dev-jump a:hover,.dev-jump a:focus-visible { color:var(--text); border-color:var(--accent); }
  .dev-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; margin:16px 0 0;
    background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .dev-metrics.metric-six { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .dev-metric { background:var(--card); padding:12px 14px; min-width:0; }
  .dev-metric .k { color:var(--muted); font-size:11px; }
  .dev-metric .v { margin-top:4px; font-size:19px; line-height:1.2; font-weight:800; overflow-wrap:anywhere; }
  .dev-metric .n { margin-top:4px; color:var(--muted); font-size:10.5px; line-height:1.45; }
  .dev-section { scroll-margin-top:88px; padding:24px 0; border-bottom:1px solid var(--line); }
  .dev-section-head[id] { scroll-margin-top:88px; }
  .dev-section:last-child { border-bottom:none; }
  .dev-section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .dev-section h3 { margin:0; font-size:16px; }
  .dev-section-head span { color:var(--muted); font-size:11.5px; }
  .dev-mission { padding:16px 18px; border-left:4px solid var(--accent); background:var(--card); border-radius:0 8px 8px 0;
    font-size:16px; line-height:1.75; font-weight:700; }
  .dev-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; margin-top:12px; }
  .dev-block { min-width:0; padding:12px 0; border-top:1px solid var(--line); }
  .dev-block .k { color:var(--muted); font-size:11px; font-weight:700; margin-bottom:5px; }
  .dev-block p { margin:0; font-size:13px; line-height:1.65; }
  .dev-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:8px; margin-top:12px; }
  .dev-list-item { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:11px 12px; }
  .dev-list-item b { display:block; font-size:12.5px; margin-bottom:4px; }
  .dev-list-item p { margin:0; color:var(--muted); font-size:11.5px; line-height:1.55; }
  .dev-id { display:inline-block; color:var(--accent); font-size:10px; font-weight:800; margin-bottom:5px; }
  .dev-flow { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
  .dev-flow-step { position:relative; min-width:0; border:1px solid var(--line); border-radius:8px; padding:11px 12px; background:var(--card); }
  .dev-flow-step::after { content:""; position:absolute; width:8px; height:8px; right:-5px; top:50%; transform:translateY(-50%) rotate(45deg);
    border-top:2px solid var(--accent); border-right:2px solid var(--accent); background:var(--bg); z-index:2; }
  .dev-flow-step:nth-child(4n)::after,.dev-flow-step:last-child::after { display:none; }
  .dev-flow-step b { display:block; font-size:12px; }
  .dev-flow-step span { display:block; color:var(--muted); font-size:10.5px; line-height:1.45; margin-top:4px; }
  .dev-chip { display:inline-flex; align-items:center; min-height:22px; padding:2px 7px; border:1px solid var(--line); border-radius:4px;
    font-size:10.5px; font-weight:750; white-space:nowrap; }
  .dev-chip.complete,.dev-chip.draft_complete,.dev-chip.machine_gate_pass,.dev-chip.inventory_complete,.dev-chip.met,.dev-chip.fulfillment_complete,
  .dev-chip.actual_elapsed_evidence_complete,.dev-chip.segment_elapsed_complete,.dev-chip.human_quality_pass,.dev-chip.human_adjudicated_pass,.dev-chip.active_current_packet,.dev-chip.slot_observed_complete,
  .dev-chip.healthy_so_far,.dev-chip.daily_evidence_complete,.dev-chip.reliability_history_complete,.dev-chip.quality_human_pass,.dev-chip.quality_history_human_pass,.dev-chip.personalization_integrity_pass { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 55%,var(--line)); }
  .dev-chip.current,.dev-chip.in_progress,.dev-chip.next,.dev-chip.complete_with_limits,
  .dev-chip.local_candidate,.dev-chip.implemented_local_candidate,.dev-chip.local_candidate_ready,
  .dev-chip.local_candidate_with_limits,.dev-chip.local_qa_pending,.dev-chip.local_qa_pass_with_limits,.dev-chip.machine_fixture_ready,
  .dev-chip.machine_observation_ready,.dev-chip.local_machine_fixture,
  .dev-chip.local_machine_observation,.dev-chip.same_pool_replay_complete,.dev-chip.inventory_backlog,.dev-chip.inventory_complete_with_holds,.dev-chip.human_annotation_ready,
  .dev-chip.human_annotation_in_progress,.dev-chip.human_annotation_complete,.dev-chip.active_packet_pinned,.dev-chip.elapsed_evidence_collecting,
  .dev-chip.elapsed_evidence_complete_with_limits,.dev-chip.actual_elapsed_evidence_complete_with_segment_holds,.dev-chip.slot_observed_with_holds,.dev-chip.underfilled,.dev-chip.fulfillment_partial,
  .dev-chip.reliability_collecting,.dev-chip.quality_history_collecting,.dev-chip.quality_review_not_sampled,.dev-chip.quality_lineage_unavailable,.dev-chip.quality_human_pending,.dev-chip.quality_review_packets_frozen,.dev-chip.quality_review_packet_waiting,.dev-chip.local_code_qa_pass_actual_slot_pending,.dev-chip.local_code_qa_pass_actual_history_pending { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); }
  .dev-chip.waiting,.dev-chip.not_observed,.dev-chip.waiting_for_first_slot,.dev-chip.slot_not_observed { color:var(--muted); }
  .dev-chip.blocked,.dev-chip.hold,.dev-chip.blocked_by_review,.dev-chip.machine_gate_hold,
  .dev-chip.human_adjudication_required,.dev-chip.human_quality_hold,.dev-chip.segment_elapsed_hold,.dev-chip.slot_observed_with_missing,.dev-chip.no_supply,.dev-chip.no_qualified_supply,.dev-chip.fulfillment_insufficient,
  .dev-chip.reliability_attention_required,.dev-chip.quality_history_attention_required,.dev-chip.quality_machine_attention,.dev-chip.quality_publish_hold,.dev-chip.quality_supply_hold,.dev-chip.quality_human_adjudication_required,.dev-chip.quality_human_hold,.dev-chip.attention_missing_slot,.dev-chip.attention_late_capture,.dev-chip.attention_inventory_hold,.dev-chip.attention_category_hold,.dev-chip.attention_repeated_content,.dev-chip.attention_evidence_limit,.dev-chip.actual_slot_observed_quality_hold,.dev-chip.personalization_integrity_hold { color:var(--danger); border-color:color-mix(in srgb,var(--danger) 55%,var(--line)); }
  .dev-table { width:100%; display:table; overflow:visible; }
  .dev-table-wrap { overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:8px; }
  .dev-table th,.dev-table td { min-width:105px; }
  .dev-table th:first-child,.dev-table td:first-child { min-width:84px; }
  .dev-table tr:last-child td { border-bottom:none; }
  .dev-score { display:inline-flex; min-width:34px; justify-content:center; font-weight:800; color:var(--accent); }
  .dev-code { display:inline-block; max-width:100%; overflow-wrap:anywhere; color:var(--text); background:var(--card2); border:1px solid var(--line);
    border-radius:4px; padding:2px 6px; font:11px/1.5 ui-monospace,"SFMono-Regular",Consolas,monospace; }
  .review-toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; margin-top:12px;
    border:1px solid var(--line); border-radius:8px; background:var(--card); }
  .review-toolbar select,.review-field select,.review-field textarea { min-height:34px; border:1px solid var(--line); border-radius:6px;
    background:var(--card2); color:var(--text); padding:6px 8px; font:12px/1.4 inherit; }
  .review-toolbar button,.review-toolbar a { min-height:34px; display:inline-flex; align-items:center; border:0; border-radius:6px; background:var(--accent); color:#fff; padding:6px 12px; font-weight:750; text-decoration:none; }
  .review-status { color:var(--muted); font-size:11.5px; }
  .review-input summary { color:var(--accent); cursor:pointer; font-size:11.5px; white-space:nowrap; }
  .review-grid { display:grid; grid-template-columns:repeat(2,minmax(150px,1fr)); gap:8px; width:min(520px,78vw); padding:10px 0 4px; }
  .review-material summary { color:var(--accent); cursor:pointer; font-size:11.5px; }
  .review-material-body { width:min(620px,76vw); padding:10px 0 2px; }
  .review-material-body b { display:block; margin-top:8px; font-size:11px; color:var(--muted); }
  .review-material-body p { margin:3px 0; line-height:1.55; font-size:12px; }
  .review-material-body ul { margin:5px 0 0; padding-left:18px; }
  .review-material-body li { margin:4px 0; line-height:1.45; font-size:11.5px; }
  .review-field { display:grid; gap:4px; color:var(--muted); font-size:10.5px; }
  .review-field.notes { grid-column:1/-1; }
  .review-field textarea { width:100%; min-height:64px; resize:vertical; }
  @media(max-width:760px){
    .wrap { padding-left:14px; padding-right:14px; }
    .dev-section,.dev-section-head[id] { scroll-margin-top:120px; }
    .dev-head { grid-template-columns:1fr; }
    .dev-section-head { align-items:flex-start; flex-direction:column; gap:5px; }
    .dev-section-head > span { max-width:100%; overflow-wrap:anywhere; }
    .dev-state { min-width:0; }
    .dev-metrics { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .dev-metrics.metric-six { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .dev-flow { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .dev-flow-step:nth-child(4n)::after { display:block; }
    .dev-flow-step:nth-child(2n)::after,.dev-flow-step:last-child::after { display:none; }
    .review-grid { width:72vw; grid-template-columns:1fr; }
    .review-field.notes { grid-column:auto; }
    .review-table-wrap { overflow:visible; border:0; }
    .review-table,.review-table tbody,.review-table tr { display:block; width:100%; }
    .review-table thead { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .review-table tbody { display:grid; gap:10px; }
    .review-table tr { border:1px solid var(--line); border-radius:8px; background:var(--card); overflow:hidden; }
    .review-table td { display:grid; grid-template-columns:88px minmax(0,1fr); gap:10px; min-width:0; padding:9px 10px; border-bottom:1px solid var(--line); }
    .review-table td::before { content:attr(data-label); color:var(--muted); font-size:10.5px; font-weight:750; }
    .review-table td:last-child { border-bottom:0; }
    .review-table details,.review-table summary { min-width:0; }
    .review-table .review-grid,.review-table .review-material-body { width:100%; }
    .review-table .review-grid { grid-template-columns:1fr; }
    .review-table .review-field.notes { grid-column:auto; }
  }
  @media(max-width:420px){
    .dev-metrics,.dev-metrics.metric-six,.dev-flow { grid-template-columns:1fr; }
    .dev-flow-step::after { display:none !important; }
    .dev-mission { font-size:14.5px; padding:14px; }
  }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <h1>🛠 관리자 로그인</h1>
    <p class="muted" style="font-size:13px">관리자 토큰을 입력하세요. (서버 <code>ADMIN_TOKEN</code>)</p>
    <input id="gateToken" type="password" placeholder="admin token" />
    <button onclick="login()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:700">입장</button>
    <p id="gateErr" class="muted" style="color:var(--danger);font-size:12.5px"></p>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>🛠 지금핫 NowHot · 관리자</h1>
      <span class="pill" id="whoami"></span>
      <span class="sp"></span>
      <a href="/" style="font-size:13px">← 서비스로</a>
      <button onclick="logout()" style="background:var(--card2);border:1px solid var(--line);color:var(--text)">로그아웃</button>
    </header>
    <div class="wrap">
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </div>
  </div>

<script>
const TABS = [
  ["dashboard","대시보드"], ["analytics","행동 분석"], ["finance","수익·지출"],
  ["communities","커뮤니티"], ["posts","게시글"], ["feedback","개선 요청"],
  ["ads","광고"], ["ourdeals","우리 딜"],
  ["comments","댓글"], ["words","금지어"], ["users","사용자"], ["blueprint","개발관리"]
];
// 개발관리 페이지는 관리자 전용 구조화 API의 읽기 전용 투영이다. 화면에 보이는
// 상태를 승인·구현·배포 완료로 오해하지 않도록 각 경계를 함께 표시한다.
let token = localStorage.getItem("admin_token") || "";
let active = "dashboard";

async function api(path, opts={}) {
  const res = await fetch(path, { ...opts, headers: { "content-type":"application/json", "x-admin-token": token, ...(opts.headers||{}) } });
  if (res.status === 401) { logout(); throw new Error("인증 실패"); }
  if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.status);
  return res.json();
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function when(iso){ if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("ko-KR"); }

async function login(){
  token = document.getElementById("gateToken").value.trim();
  try { await api("/api/admin/stats"); localStorage.setItem("admin_token", token); boot(); }
  catch(e){ document.getElementById("gateErr").textContent = "토큰이 올바르지 않습니다."; }
}
function logout(){ localStorage.removeItem("admin_token"); token=""; document.getElementById("app").classList.add("hidden"); document.getElementById("gate").classList.remove("hidden"); }

function boot(){
  document.getElementById("gate").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  const tabsEl = document.getElementById("tabs"); tabsEl.innerHTML="";
  for (const [id,label] of TABS){
    const b=document.createElement("button"); b.className="tab"+(id===active?" active":""); b.textContent=label;
    b.onclick=()=>{ active=id; boot(); }; tabsEl.appendChild(b);
  }
  render();
}

async function render(){
  const panel=document.getElementById("panel"); panel.innerHTML='<p class="empty">불러오는 중…</p>';
  try {
    if (active==="dashboard") return renderDashboard(panel);
    if (active==="analytics") return renderAnalytics(panel);
    if (active==="finance") return renderFinance(panel);
    if (active==="ads") return renderAds(panel);
    if (active==="ourdeals") return renderOurDeals(panel);
    if (active==="blueprint") return renderBlueprint(panel);
    if (active==="communities") return renderCommunities(panel);
    if (active==="posts") return renderPosts(panel);
    if (active==="feedback") return renderServiceFeedback(panel);
    if (active==="comments") return renderComments(panel);
    if (active==="words") return renderWords(panel);
    if (active==="users") return renderUsers(panel);
  } catch(e){ panel.innerHTML='<p class="empty" style="color:var(--danger)">'+esc(e.message)+'</p>'; }
}


// ── 날짜 선택기 — 대시보드·행동 분석 공유 상태 ──────────────────────────────
// 네이버 광고관리식: 프리셋 칩(오늘/어제/최근 7일/최근 30일/이번 달/지난달)
// + 직접 기간(date 입력 2개, iOS 사파리 호환) + 일/주/월 토글.
// localStorage에 저장해 재방문·탭 전환에도 유지된다.
const RANGE_KEY = "admin_range";
const PRESETS = [["today","오늘"],["yesterday","어제"],["7d","최근 7일"],["30d","최근 30일"],["thisMonth","이번 달"],["lastMonth","지난달"]];
function kstDay(offsetDays=0){ return new Date(Date.now()+9*3600*1000-offsetDays*86400000).toISOString().slice(0,10); }
function presetRange(p, gran){
  const today = kstDay(0);
  let from = today, to = today;
  if (p==="yesterday") { from = to = kstDay(1); }
  else if (p==="7d") from = kstDay(6);
  else if (p==="30d") from = kstDay(29);
  else if (p==="thisMonth") from = today.slice(0,7)+"-01";
  else if (p==="lastMonth") {
    const d = new Date(today.slice(0,7)+"-01T00:00:00Z"); d.setUTCDate(0); // 지난달 말일
    to = d.toISOString().slice(0,10); from = to.slice(0,7)+"-01";
  }
  return { preset:p, from, to, gran: gran||"day" };
}
let range = (()=>{ try{ const r=JSON.parse(localStorage.getItem(RANGE_KEY)||"null");
  // from>to 파손값은 기본 기간으로 자가 복구 — 안 걸러주면 400 → "데이터
  // 없음"에 영영 갇힌다(검수).
  if (r && /^\d{4}-\d{2}-\d{2}$/.test(r.from||"") && /^\d{4}-\d{2}-\d{2}$/.test(r.to||"") && r.from <= r.to && ["day","week","month"].includes(r.gran)) {
    // 프리셋은 "오늘 기준"이라 저장된 절대 날짜가 낡는다 — 재계산해서 쓴다.
    return r.preset && r.preset!=="custom" ? presetRange(r.preset, r.gran) : r;
  } }catch{} return presetRange("30d","day"); })();
function saveRange(){ try{ localStorage.setItem(RANGE_KEY, JSON.stringify(range)); }catch{} }
function setPreset(p){ range = presetRange(p, range.gran); saveRange(); render(); }
function setGran(g){ range = { ...range, gran:g }; saveRange(); render(); }
function applyCustomRange(){
  const from = document.getElementById("rgFrom").value, to = document.getElementById("rgTo").value;
  if (!from || !to || from > to) return alert("기간이 올바르지 않습니다 (시작 ≤ 끝).");
  range = { preset:"custom", from, to, gran:range.gran }; saveRange(); render();
}
function rangeBarHtml(){
  const chips = PRESETS.map(([id,label])=>'<button class="rchip'+(range.preset===id?" active":"")+'" onclick="setPreset(\''+id+'\')">'+label+'</button>').join("");
  const gbtn = (id,label)=>'<button class="rchip'+(range.gran===id?" active":"")+'" onclick="setGran(\''+id+'\')">'+label+'</button>';
  return '<div class="rangebar">'+chips+
    '<span class="gsep"></span>'+
    '<input type="date" id="rgFrom" value="'+esc(range.from)+'"> ~ <input type="date" id="rgTo" value="'+esc(range.to)+'">'+
    '<button class="rchip'+(range.preset==="custom"?" active":"")+'" onclick="applyCustomRange()">적용</button>'+
    '<span class="gsep"></span>'+gbtn("day","일")+' '+gbtn("week","주")+' '+gbtn("month","월")+
    '</div>';
}

// ── 행동 분석 ───────────────────────────────────────────────────────────────
function pct(v){ return v==null ? "—" : (v*100).toFixed(2)+"%"; }
function num(v){ return v==null ? "—" : Number(v).toLocaleString("ko-KR"); }
function sec(v){ return v==null ? "—" : (v>=60 ? Math.floor(v/60)+"분 "+(v%60)+"초" : v+"초"); }

function kvTable(rows, headers){
  if(!rows || !rows.length) return '<p class="empty">아직 기록이 없어요</p>';
  const max = Math.max(...rows.map(r=>r.count||0), 1);
  return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.key)+'</td><td style="text-align:right;font-variant-numeric:tabular-nums">'+num(r.count)+
      '</td><td style="width:38%"><div style="background:var(--accent);height:8px;border-radius:4px;width:'+
      Math.round((r.count/max)*100)+'%"></div></td></tr>').join('')+'</tbody></table>';
}
function adTable(rows){
  if(!rows || !rows.length) return '<p class="empty">아직 노출 기록이 없어요</p>';
  return '<table><thead><tr><th>슬롯 / 문구</th><th>노출</th><th>클릭</th><th>CTR</th></tr></thead><tbody>'+
    rows.map(r=>'<tr><td>'+esc(r.key)+'</td><td>'+num(r.imp)+'</td><td>'+num(r.click)+'</td><td>'+pct(r.ctr)+'</td></tr>').join('')+
    '</tbody></table>';
}

// David 2026-08-05: "나랑 연결되어 있는 광고와 붙일 수 있는 광고들 리스트로
// 만들어서 관리할 수 있으면 좋겠네. 연동해서 수입까지 나오면 더 좋고."
//
// 이 화면의 규칙은 하나다: **지어내지 않는다.** 정산 연동이 없으므로 금액 칸은
// 비워 두고, 왜 비었는지를 그 자리에 적는다. 0원으로 채우면 "안 벌린다"로
// 읽히는데 그건 사실이 아니라 미측정이다.

//
// 애드핏 4차 반려: "자체 콘텐츠가 아닌 외부 콘텐츠, 외부 링크가 많은 비중을
// 차지하고 있는 매체는 광고 게재가 허용되지 않습니다."
//
// 커뮤니티에서 긁어 온 딜은 아웃링크다. 우리가 고르고 우리가 쓴 상품 소개는

// **가격·상품명은 여기서 입력받는다.** 쿠팡 짧은 링크는 Akamai 봇 차단 + JS
// 리다이렉트라 서버에서 상품 정보를 뽑을 수 없고(2026-08-06 실측), 상품
// 페이지를 긁는 것은 우리 원칙에 어긋난다. 지어내지 않고 David가 확인한
// 값만 쓴다.

  const { deals } = await api("/api/admin/our-deals");
  const cats = [["life","라이프/취미"],["tech","기술/IT"],["business","경제/비즈니스"],
                ["culture","문화/연예"],["sports","스포츠"],["auto","자동차"]];
  const dests = [["","(자동)"],["fresh","신선식품"],["dgt","가전·디지털"],["fashion","패션·잡화"],
                 ["kitchen","주방"],["home","홈인테리어"],["baby","출산·유아동"],["pet","반려동물"],
                 ["book","도서"],["toy","완구·취미"],["camp","캠핑"],["outdoor","등산·아웃도어"],
                 ["golf","골프"],["carparts","자동차용품"],["oversea","해외직구"]];
  panel.innerHTML = `
    <div class="card">
      <h3>딜 등록</h3>
      <p class="sub">쿠팡 파트너스에서 만든 <b>짧은 링크</b>를 넣으세요(link.coupang.com).
        상품명·가격은 콘솔에서 확인한 값 그대로 적어주세요 — 서버가 알아낼 수 없는 값이라
        <b>지어내지 않습니다</b>. 사진은 파트너스 화면에서 상품 이미지 주소를 복사해 넣으면 됩니다.</p>
      <div class="form">
        <label>제휴 링크 <input id="odUrl" placeholder="https://link.coupang.com/a/..."></label>
        <label>상품명 <input id="odTitle" placeholder="정확한 상품 이름"></label>
        <label>가격 <input id="odPrice" placeholder="39,900원"></label>
        <label>사진 주소 <input id="odImage" placeholder="https://... (선택)"></label>
        <label>한 줄 소개 <input id="odNote" placeholder="왜 고른 물건인지 (선택)"></label>
        <label>분류 <select id="odCat">${cats.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></label>
        <label>상품군 <select id="odDest">${dests.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join("")}</select></label>
      </div>
      <button id="odSave">등록</button>
      <div id="odMsg" class="sub"></div>
    </div>
    <div class="card">
      <h3>등록한 딜 <span class="sub">${deals.length}건</span></h3>
      ${deals.length ? `<table><thead><tr><th>상품</th><th>가격</th><th>등록</th><th></th></tr></thead><tbody>` +
        deals.map(d=>`<tr>
          <td><b>${esc(d.title)}</b><div class="sub">${esc(d.summary||"")}</div>
              <div class="sub"><a href="${esc(d.url)}" target="_blank" rel="noopener nofollow sponsored">링크 열기 →</a></div></td>
          <td>${esc(d.price)}</td>
          <td class="sub">${esc(new Date(d.createdAt||Date.now()).toLocaleString("ko-KR"))}</td>
          <td><button data-del="${esc(d.id)}">삭제</button></td>
        </tr>`).join("") + `</tbody></table>`
        : `<p class="sub">아직 등록한 딜이 없어요.</p>`}
    </div>`;

  document.getElementById("odSave").onclick = async () => {
    const msg = document.getElementById("odMsg");
    const val = (id) => document.getElementById(id).value.trim();
    msg.textContent = "등록 중…";
    try {
      const r = await fetch("/api/admin/our-deal", {
        method: "POST",
        headers: { "content-type": "application/json", "x-admin-token": token },
        body: JSON.stringify({
          url: val("odUrl"), title: val("odTitle"), price: val("odPrice"),
          image: val("odImage"), note: val("odNote"),
          category: val("odCat"), dest: val("odDest")
        })
      });
      const j = await r.json();
      if (!r.ok) { msg.textContent = "안 됨: " + (j.error || r.status); return; }
      render();
    } catch (e) { msg.textContent = "안 됨: " + e.message; }
  };
  panel.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("이 딜을 내릴까요?")) return;
    await api("/api/admin/our-deal-delete", { method: "POST", body: JSON.stringify({ id: b.dataset.del }) });
    render();
  });
}

function humanReviewProgress(summary){
  if(!summary) return "집계 없음";
  const a=summary.completedByReviewer&&summary.completedByReviewer["reviewer-a"];
  const b=summary.completedByReviewer&&summary.completedByReviewer["reviewer-b"];
  const agreement=summary.agreement&&summary.agreement.rate!=null?` · 일치 ${summary.agreement.rate}%`:"";
  return `A ${a?a.completed:0}/${summary.requiredRows} · B ${b?b.completed:0}/${summary.requiredRows} · 2인 ${summary.doubleReviewed}/${summary.requiredRows}${agreement}`;
}
function reviewFieldLabel(field){

function reviewStatus(message, error=false){

async function loadEditorialReview(packet){
  if(!packet) return;
  const reviewerId=document.getElementById("editorialReviewer").value;
  reviewStatus("불러오는 중");
  try{
    const data=await api(`/api/admin/editorial-review?reviewerId=${encodeURIComponent(reviewerId)}`);
    const byId=new Map((data.annotations||[]).map(row=>[row.blindId,row]));
    document.querySelectorAll("[data-review-row][data-review-field]").forEach(control=>{
      const row=byId.get(control.dataset.reviewRow)||{};
      const value=row[control.dataset.reviewField];
      if(control.tagName==="TEXTAREA") control.value=value||"";
      else control.value=value===true?"true":value===false?"false":"";
    });
    reviewStatus(`${data.savedAt?`마지막 로컬 저장 ${when(data.savedAt)}`:"이 검수자의 저장 내역 없음"} · ${humanReviewProgress(data.humanReview)}`);
  }catch(error){ reviewStatus(error.message,true); }
}
async function saveEditorialReview(packet, panel){
  if(!packet) return;
  const reviewerId=document.getElementById("editorialReviewer").value;
  const button=document.getElementById("editorialReviewSave");
  button.disabled=true;
  reviewStatus("저장 중");
  try{
    const controls=[...document.querySelectorAll("[data-review-row][data-review-field]")];
    const annotations=packet.rows.map(row=>{
      const out={blindId:row.blindId};
      for(const [field] of EDITORIAL_REVIEW_FIELDS){
        const control=controls.find(el=>el.dataset.reviewRow===row.blindId&&el.dataset.reviewField===field);
        out[field]=control.value==="true"?true:control.value==="false"?false:null;
      }
      const notes=controls.find(el=>el.dataset.reviewRow===row.blindId&&el.dataset.reviewField==="notes");
      out.notes=notes?notes.value.trim():"";
      return out;
    });
    const data=await api("/api/admin/editorial-review",{
      method:"POST",
      body:JSON.stringify({packetId:packet.packetId,editionId:packet.editionId,reviewerId,annotations})
    });
    reviewStatus(`로컬 저장 완료 ${when(data.savedAt)} · ${humanReviewProgress(data.humanReview)}`);
    if(data.humanReview&&data.humanReview.comparisonReady) await renderBlueprint(panel);
  }catch(error){ reviewStatus(error.message,true); }
  finally{ button.disabled=false; }
}

async function saveEditorialAdjudication(packet, panel){

      return {

        field:control.dataset.field,
        value:control.value==="true"?true:control.value==="false"?false:null,
        notes:notes?notes.value.trim():""
      };
    });

      method:"POST",
      body:JSON.stringify({packetId:packet.packetId,editionId:packet.editionId,resolutions})
    });
    adjudicationStatus(`조정 원장 저장 ${when(data.savedAt)} · ${devStateLabel(data.humanReview.state)}`);
    await renderBlueprint(panel);
  }catch(error){ adjudicationStatus(error.message,true); }
  finally{ button.disabled=false; }

function wireEditorialReview(packet, panel){
  if(!packet||!document.getElementById("editorialReviewer")) return;
  document.getElementById("editorialReviewer").onchange=()=>loadEditorialReview(packet);
  document.getElementById("editorialReviewSave").onclick=()=>saveEditorialReview(packet,panel);
  const activate=document.getElementById("editorialReviewPacketActivate");
  if(activate) activate.onclick=()=>activateEditorialReviewPacket(panel);
  const adjudicate=document.getElementById("editorialAdjudicationSave");
  if(adjudicate) adjudicate.onclick=()=>saveEditorialAdjudication(packet,panel);
  loadEditorialReview(packet);
}

async function renderDashboard(panel){
  // 병렬 로드: 통계(+광고), 선택 기간 트래픽, KPI Δ용 최근 9일, 소스 헬스, 공개 설정
  const [statsRes, rangeRes, kpiRes, healthRes, config] = await Promise.all([
    api("/api/admin/stats"),
    api("/api/admin/traffic-range?from="+range.from+"&to="+range.to+"&granularity="+range.gran).catch(()=>null),
    // Δ는 확정일 비교(어제 vs 지난주 같은 요일) — 오늘은 부분일이라 절대값만.
    api("/api/admin/traffic-range?from="+kstDay(8)+"&to="+kstDay(0)+"&granularity=day").catch(()=>null),
    api("/api/admin/source-health").catch(()=>null),
    fetch("/api/config").then(r=>r.ok?r.json():null).catch(()=>null)
  ]);

    <div class="panel-h">👥 유저 요약</div>

      <div class="stat"><b>${stats.ratings}</b><span>좋아요/싫어요</span></div>

      <div class="stat"><b>${communities.enabled}/${communities.total}</b><span>커뮤니티(활성)</span></div>
    </div>

    <div class="row-card"><b>추가 금지어</b> ${stats.bannedWords.length?stats.bannedWords.map(w=>`<span class="pill">${esc(w)}</span>`).join(""):'<span class="muted">없음</span>'}</div>`;

// Δ 표기 — 확정일끼리만 비교한다(오늘은 부분일이라 Δ를 만들지 않는다).
function deltaHtml(cur, prev){
  if (cur==null || prev==null) return "";
  const d = cur - prev;
  if (!prev) return d ? '<span class="delta up">+'+d+'</span>' : "";
  const pctv = Math.round((d/prev)*100);
  if (!d) return '<span class="delta">±0</span>';
  return '<span class="delta '+(d>0?"up":"down")+'">'+(d>0?"+":"")+d+' ('+(pctv>0?"+":"")+pctv+'%)</span>';
}

// 트래픽 패널: 기간 KPI(사람 먼저) + 사람/전체/PV 막대 + 숫자 표.
// rows = 선택 기간(/api/admin/traffic-range), kpiRows = Δ용 최근 9일(일별).
// 실측만 — 없으면 "데이터 없음". 아카이브 구간의 피드 수는 미계측(—)이다.
function trafficHtml(rows, kpiRows){
  if (!Array.isArray(rows)) return '<p class="empty">데이터 없음 — 트래픽 API를 불러오지 못했습니다.</p>';
  const todayKey = kstDay(0), yKey = kstDay(1), lwKey = kstDay(8); // 지난주 같은 요일
  const find = (rs,k)=>(rs||[]).find(r=>r.key===k) || null;
  const today = find(kpiRows,todayKey), yday = find(kpiRows,yKey), lastWk = find(kpiRows,lwKey);
  const sum = f => rows.reduce((a,r)=>a+(r[f]==null?0:r[f]),0);
  const anyApprox = rows.some(r=>r.humanApprox);
  const kpi = `
    <div class="stats">
      <div class="stat big"><b>${today?today.human:0}</b><span>오늘 사람 (집계 중 · Δ 없음)</span></div>
      <div class="stat big"><b>${yday?yday.human:0}${deltaHtml(yday&&yday.human, lastWk&&lastWk.human)}</b><span>어제 사람 vs 지난주 ${esc(lwKey.slice(5))}</span></div>
      <div class="stat"><b>${sum("human")}</b><span>기간 사람 합계</span></div>
      <div class="stat"><b>${sum("visitors")}</b><span>기간 전체 (봇·점검 포함)</span></div>
      <div class="stat"><b>${sum("pv")}</b><span>기간 PV</span></div>
    </div>`;
  if (!rows.length) return kpi + '<p class="empty">이 기간에 집계된 트래픽이 없습니다.</p>';
  const max = Math.max(1, ...rows.map(r=>Math.max(r.pv, r.visitors)));
  const barH = v => Math.max(3, Math.round(v/max*100));
  const lab = k => range.gran==="month" ? k.slice(2) : k.slice(5).replace("-","/");
  const cols = rows.map(r=>`
    <div class="bcol" title="${esc(r.key)} · 사람 ${r.human}${r.humanApprox?"*":""} · 전체 ${r.visitors} · PV ${r.pv} · 피드 ${r.feed==null?"—":r.feed}">
      <div class="bpair">
        <div class="bar hum${r.human?'':' zero'}" style="height:${r.human?barH(r.human):2}px"></div>
        <div class="bar vis${r.visitors?'':' zero'}" style="height:${r.visitors?barH(r.visitors):2}px"></div>
        <div class="bar pv${r.pv?'':' zero'}" style="height:${r.pv?barH(r.pv):2}px"></div>
      </div>
      <div class="blab">${esc(lab(r.key))}</div>
    </div>`).join("");
  const tbl = `
    <div class="tblwrap"><table>
      <thead><tr><th>${range.gran==="week"?"주 (월요일)":range.gran==="month"?"월":"날짜"}</th><th class="num">사람</th><th class="num">전체 (봇·점검 포함)</th><th class="num">PV</th><th class="num">피드</th></tr></thead>
      <tbody>${rows.slice().reverse().map(r=>`<tr>
        <td>${esc(r.key)}${r.humanApprox?"*":""}</td>
        <td class="num"><b>${num(r.human)}</b></td>
        <td class="num">${num(r.visitors)}</td>
        <td class="num">${num(r.pv)}</td>
        <td class="num">${r.feed==null?"—":num(r.feed)}</td>
      </tr>`).join("")}</tbody>
    </table></div>`;
  return kpi + `
    <div class="row-card">
      <div class="bars">${cols}</div>
      <div class="legend"><span><i style="background:var(--warn)"></i>사람</span><span><i style="background:var(--ok)"></i>전체 방문자</span><span><i style="background:var(--accent)"></i>페이지뷰</span></div>
      ${tbl}
      ${anyApprox?'<p class="muted" style="margin:6px 0 0;font-size:11.5px">* 표시 구간은 사람 수가 예전 방식(engaged 소급)이라 소급 변동할 수 있습니다.</p>':''}
      <p class="muted" style="margin:6px 0 0;font-size:11.5px">서버 측정(traffic) 축 — 오늘의 Δ는 만들지 않습니다(부분일 vs 완결일 비교는 항상 음수로 오독됩니다).
      어제 Δ만 지난주 같은 요일과 비교합니다. 주/월 행의 사람·전체는 일별 유니크의 합산이라 기간 유니크와 다를 수 있고,
      아카이브(90일 초과) 구간의 피드 수는 미계측이라 —로 둡니다.</p>
      <p class="muted" style="margin:6px 0 0;font-size:11.5px">사람 = 그날 <b>클릭 게이트가 확실한</b> 상호작용(열람·평가·저장·댓글·설문)이
      있었던 방문자(store.markHumanDay, Phase 1). 스크롤만으로 자동 발화하는 skip·dwell·complete는 근거로 안 친다.
      이 필드가 아직 없던 과거 날짜는 예전 방식(평생 흔적 소급 engaged)으로 대신 표시된다 — 이행기 표시일 뿐 오차가 아니다.
      전체에는 JS를 실행하는 크롤러가 섞인다(배포 점검은 집계에서 제외됨). 한계: 재방문해서 읽기만 하고
      아무것도 클릭하지 않은 진짜 사람은 그날 "사람"에 안 잡힌다(과소).</p>
    </div>`;
}

// 수익 패널: 광고 노출/클릭 실측 + 채널 활성 여부 (/api/config monetization·adfit)
function revenueHtml(ads, config){
  const adStats = ads
    ? `<div class="stats">
        <div class="stat"><b>${ads.impressions}</b><span>광고 노출</span></div>
        <div class="stat"><b>${ads.clicks}</b><span>광고 클릭</span></div>
        <div class="stat"><b>${ads.impressions?(ads.ctr*100).toFixed(2)+"%":"—"}</b><span>CTR${ads.impressions?"":" (노출 없음)"}</span></div>
      </div>`
    : '<p class="empty">데이터 없음 — 광고 지표를 불러오지 못했습니다.</p>';
  let channels;
  if (config) {
    const ch = (label, on, note) => `<div class="srcline"><span class="dot" style="background:${on?"var(--ok)":"var(--line)"}"></span>${esc(label)}<span class="cnt ${on?"":"muted"}">${on?"활성":"미설정"}${note?` · ${esc(note)}`:""}</span></div>`;
    channels = `<div class="row-card">
      ${ch("제휴/광고 슬롯 (monetization)", config.monetization && config.monetization.enabled)}
      ${ch("카카오 애드핏 배너", config.adfit && config.adfit.mobileUnit, config.adfit && config.adfit.mobileUnit ? config.adfit.mobileUnit : "")}
    </div>`;
  } else {
    channels = '<p class="empty">데이터 없음 — 채널 설정(/api/config)을 불러오지 못했습니다.</p>';
  }
  return adStats + channels;
}

// 소스 헬스 패널: 수집 풀 실측 건수 — 0건 라이브 소스는 빨간 표시
function sourceHealthHtml(sources){
  if (!Array.isArray(sources)) return '<p class="empty">데이터 없음 — 소스 헬스 API를 불러오지 못했습니다.</p>';
  const live = sources.filter(s=>s.enabled && !s.seed);
  if (!live.length) return '<p class="empty">데이터 없음 — 등록된 라이브 소스가 없습니다.</p>';
  live.sort((a,b)=>a.liveCount-b.liveCount || String(a.label).localeCompare(String(b.label),"ko"));
  const dead = live.filter(s=>!s.disabled && s.liveCount===0).length;
  const rows = live.map(s=>{
    const color = s.disabled ? "var(--muted)" : (s.liveCount===0 ? "var(--danger)" : "var(--ok)");
    const cnt = s.disabled
      ? '<span class="cnt muted">비활성</span>'
      : (s.liveCount===0
        ? '<span class="cnt" style="color:var(--danger);font-weight:700">0건</span>'
        : `<span class="cnt">${s.liveCount}건</span>`);
    return `<div class="srcline"><span class="dot" style="background:${color}"></span>${esc(s.label)} <span class="country">${esc(s.category)}·${esc(s.kind)}</span>${cnt}</div>`;
  }).join("");
  return `<div class="row-card">
    <div class="muted" style="font-size:12.5px;margin-bottom:6px">라이브 소스 ${live.length}곳 · <span style="color:${dead?"var(--danger)":"var(--ok)"}">수집 0건 ${dead}곳</span> — 수치는 현재 수집 풀 실측입니다. 개별 점검은 커뮤니티 탭의 🩺 수집 점검.</div>
    ${rows}
  </div>`;
}

async function renderCommunities(panel){
  const { communities } = await api("/api/admin/communities");
  const colors={};
  const rows = communities.map(c=>`<tr>
    <td><b>${esc(c.label)}</b> <span class="country">${esc(c.country)}·${esc(c.lang)}${c.adult?" · 🔞":""}</span></td>
    <td class="muted">${esc(c.category)} / ${esc(c.kind)} / ${esc(c.size||"")}</td>
    <td>${c.enabled?'<span style="color:var(--ok)">등록</span>':'<span class="muted">비등록</span>'}</td>
    <td><button class="toggle ${c.disabled?'off':''}" onclick="toggleCommunity('${esc(c.id)}',${!c.disabled})">${c.disabled?'비활성(켜기)':'활성(끄기)'}</button></td>
  </tr>`).join("");
  panel.innerHTML = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <p class="muted" style="font-size:12.5px;margin:0;flex:1">전역으로 끄면 모든 사용자 피드에서 해당 커뮤니티가 사라집니다.</p>
      <button id="checkSrc" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600">🩺 수집 점검</button>
    </div>
    <div id="checkResult" style="margin-bottom:10px"></div>
    <table><thead><tr><th>커뮤니티</th><th>분류</th><th>수집</th><th>노출</th></tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById("checkSrc").onclick = async ()=>{
    const box = document.getElementById("checkResult");
    box.innerHTML = '<span class="muted" style="font-size:12.5px">실제 피드에 접속해 확인하는 중…</span>';
    try {
      const { results } = await api("/api/admin/check-sources", { method:"POST", body:"{}" });
      if(!results.length){ box.innerHTML = '<span class="muted">점검할 라이브 소스가 없습니다.</span>'; return; }
      box.innerHTML = results.map(r => r.ok
        ? `<div class="row-card" style="border-color:var(--ok)">✅ <b>${esc(r.label)}</b> — ${r.items}개 수신 (${r.ms}ms)</div>`
        : `<div class="row-card" style="border-color:var(--danger)">❌ <b>${esc(r.label)}</b> — ${esc(r.error)} <span class="muted">(${r.ms}ms)</span></div>`
      ).join("");
    } catch(e){ box.innerHTML = '<span style="color:var(--danger);font-size:12.5px">점검 실패: '+esc(e.message)+'</span>'; }
  };
}
async function toggleCommunity(id, disabled){
  await api("/api/admin/community",{method:"POST",body:JSON.stringify({id,disabled})}); render();
}

  const { requests } = await api("/api/admin/feedback");
  if(!requests.length){ panel.innerHTML='<p class="empty">접수된 개선 요청이 없습니다.</p>'; return; }
  const labels = { suggestion:"개선 제안", bug:"오류 신고", other:"기타" };
  panel.innerHTML = '<p class="muted">최근 접수 200건 · 관리자에게만 표시됩니다.</p>' + requests.map(r=>`<div class="row-card">
    <strong>${esc(labels[r.kind] || r.kind)}</strong> <span class="muted">${when(r.createdAt)}</span>
    <p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.message)}</p>
    <div class="muted" style="font-size:12px;overflow-wrap:anywhere">${esc(r.id)} · ${esc(r.userId)} · 빌드 ${esc(r.build)}</div>
  </div>`).join("");
}

async function delComment(id){ if(!confirm("이 댓글을 삭제할까요?"))return; await api("/api/admin/delete-comment",{method:"POST",body:JSON.stringify({id})}); render(); }

async function renderWords(panel){
  const { stats } = await api("/api/admin/stats");
  const chips = stats.bannedWords.map(w=>`<span class="wordchip">${esc(w)} <button onclick="rmWord('${esc(w)}')">✕</button></span>`).join("") || '<span class="muted">추가된 금지어가 없습니다.</span>';

async function renderUsers(panel){

  if(!users.length){ panel.innerHTML='<p class="empty">사용자가 없습니다.</p>'; return; }
  const rows = users.map(u=>`<tr>
    <td>${esc(u.id)}</td><td>${u.surveyed?"✓":"—"}</td><td>${u.posts}</td><td>${u.comments}</td>
    <td>${u.feedbackCount}</td><td>${u.ageVerified?"🔞":"—"}</td><td class="muted">${when(u.createdAt)}</td>
  </tr>`).join("");
  panel.innerHTML = `<table><thead><tr><th>ID</th><th>설문</th><th>글</th><th>댓글</th><th>피드백</th><th>성인</th><th>가입</th></tr></thead><tbody>${rows}</tbody></table>`;
}
