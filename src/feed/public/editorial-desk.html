<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>편집 데스크 · 지금핫</title>
  <style>
    :root {
      color-scheme:light;
      --bg:#f4f5f7;
      --surface:#fff;
      --surface-alt:#f8f9fa;
      --text:#15171a;
      --muted:#68707c;
      --line:#d9dde3;
      --accent:#e52b1a;
      --accent-soft:#fff0ed;
      --ok:#16784a;
      --ok-soft:#eaf7f0;
      --warn:#a45b08;
      --warn-soft:#fff6e7;
      --focus:#215bd8;
      --header-h:64px;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body { font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; font-size:14px; line-height:1.5; }
    button,input,textarea { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    a { color:inherit; }
    [hidden] { display:none !important; }
    :focus-visible { outline:3px solid color-mix(in srgb,var(--focus) 30%,transparent); outline-offset:2px; }

    .login-shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .login-panel { width:min(360px,100%); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:24px; }
    .login-panel h1 { margin:0 0 6px; font-size:21px; letter-spacing:0; }
    .login-panel p { margin:0 0 18px; color:var(--muted); }
    .login-panel input { width:100%; height:42px; border:1px solid var(--line); border-radius:5px; padding:0 11px; }
    .login-panel button { width:100%; height:42px; margin-top:10px; border:0; border-radius:5px; background:var(--text); color:#fff; font-weight:750; }
    .login-error { min-height:20px; margin-top:8px; color:var(--accent); font-size:13px; }

    .topbar { position:sticky; top:0; z-index:20; height:var(--header-h); display:grid; grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr); align-items:center; gap:16px; padding:0 22px; background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
    .brand { display:flex; align-items:center; min-width:0; gap:10px; text-decoration:none; font-weight:800; }
    .brand-mark { display:grid; place-items:center; width:30px; height:30px; border-radius:5px; background:var(--text); color:#fff; font-size:16px; }
    .brand-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .brand-name span { color:var(--muted); font-weight:650; margin-left:6px; }
    .seat-switch { display:grid; grid-template-columns:1fr 1fr; width:210px; height:36px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--surface-alt); }
    .seat-switch button { border:0; background:transparent; color:var(--muted); font-weight:750; }
    .seat-switch button.active { background:var(--text); color:#fff; }
    .top-actions { justify-self:end; display:flex; align-items:center; gap:8px; }
    .top-actions a,.top-actions button { display:inline-grid; place-items:center; min-height:34px; border:1px solid var(--line); border-radius:5px; background:var(--surface); padding:0 11px; text-decoration:none; color:var(--muted); font-weight:700; }

    .statusbar { min-height:46px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:16px; padding:8px 22px; background:var(--surface); border-bottom:1px solid var(--line); }
    .packet-meta { min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:7px 12px; }
    .packet-meta strong { font-size:14px; }
    .packet-meta span { color:var(--muted); font-size:12px; }
    .save-state { color:var(--muted); font-size:12px; white-space:nowrap; }
    .save-state.error { color:var(--accent); }

    .workspace { min-height:calc(100vh - var(--header-h) - 46px); display:grid; grid-template-columns:280px minmax(440px,1fr) 330px; max-width:1500px; margin:0 auto; background:var(--surface); border-inline:1px solid var(--line); }
    .queue,.rubric { background:var(--surface-alt); }
    .queue { border-right:1px solid var(--line); }
    .rubric { border-left:1px solid var(--line); }
    .pane-head { min-height:72px; padding:14px 16px; border-bottom:1px solid var(--line); }
    .pane-head-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
    .pane-head h2 { margin:0; font-size:15px; letter-spacing:0; }
    .pane-head strong { font-size:13px; }
    .progress-track { height:5px; margin-top:11px; overflow:hidden; background:#e4e7eb; border-radius:2px; }
    .progress-track span { display:block; height:100%; background:var(--ok); transition:width 180ms ease; }
    .filter-tabs { display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); }
    .filter-tabs button { height:40px; border:0; border-right:1px solid var(--line); background:var(--surface); color:var(--muted); font-weight:700; }
    .filter-tabs button:last-child { border-right:0; }
    .filter-tabs button.active { color:var(--accent); box-shadow:inset 0 -2px var(--accent); }
    .issue-list { max-height:calc(100vh - 223px); overflow:auto; }
    .issue-button { width:100%; min-height:76px; display:grid; grid-template-columns:30px 1fr 10px; align-items:start; gap:8px; padding:11px 13px; border:0; border-bottom:1px solid var(--line); background:var(--surface); text-align:left; }
    .issue-button:hover { background:#fafbfc; }
    .issue-button.active { background:var(--accent-soft); box-shadow:inset 3px 0 var(--accent); }
    .issue-number { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
    .issue-copy { min-width:0; }
    .issue-category { display:block; margin-bottom:3px; color:var(--muted); font-size:11px; font-weight:750; }
    .issue-title { display:-webkit-box; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; font-weight:700; line-height:1.38; }
    .issue-state { width:8px; height:8px; margin-top:5px; border-radius:50%; background:#c7ccd2; }
    .issue-state.complete { background:var(--ok); }
    .issue-state.held { background:var(--accent); }
    .queue-empty { padding:24px 16px; color:var(--muted); text-align:center; }

    .story { min-width:0; background:var(--surface); }
    .story-inner { width:min(760px,100%); margin:0 auto; padding:34px 34px 80px; }
    .story-kicker { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:14px; color:var(--accent); font-size:12px; font-weight:800; }
    .tag { display:inline-flex; align-items:center; min-height:24px; border:1px solid var(--line); border-radius:4px; padding:0 7px; background:var(--surface-alt); color:var(--muted); }
    .story h1 { margin:0; font-size:27px; line-height:1.34; letter-spacing:0; overflow-wrap:anywhere; }
    .story-lead { margin:18px 0 26px; font-size:17px; line-height:1.75; color:#30343a; }
    .brief-grid { border-top:2px solid var(--text); }
    .brief-row { display:grid; grid-template-columns:124px 1fr; gap:20px; padding:15px 0; border-bottom:1px solid var(--line); }
    .brief-row dt { color:var(--muted); font-size:12px; font-weight:800; }
    .brief-row dd { margin:0; line-height:1.65; overflow-wrap:anywhere; }
    .sources { margin-top:28px; }
    .sources h2 { margin:0 0 10px; font-size:14px; }
    .source-row { display:grid; grid-template-columns:90px 1fr; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
    .source-row b { color:var(--muted); font-size:12px; }
    .source-row a { overflow-wrap:anywhere; text-decoration-thickness:1px; text-underline-offset:3px; }
    .canonical { margin-top:24px; border-top:1px solid var(--line); }
    .canonical summary { padding:12px 0; cursor:pointer; color:var(--muted); font-weight:700; }
    .canonical-body { padding:0 0 18px; color:var(--muted); }
    .canonical-body b { display:block; margin-top:12px; color:var(--text); font-size:12px; }
    .canonical-body p { margin:4px 0 0; overflow-wrap:anywhere; }

    .rubric .pane-head p { margin:5px 0 0; color:var(--muted); font-size:12px; }
    .rubric-body { padding:14px; }
    .review-item { padding:0 0 16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
    .review-item:last-of-type { margin-bottom:10px; }
    .review-item b { display:block; font-size:13px; }
    .review-item p { min-height:42px; margin:4px 0 9px; color:var(--muted); font-size:12px; }
    .answer-switch { display:grid; grid-template-columns:repeat(3,1fr); height:34px; overflow:hidden; border:1px solid var(--line); border-radius:5px; }
    .answer-switch button { border:0; border-right:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:12px; font-weight:750; }
    .answer-switch button:last-child { border-right:0; }
    .answer-switch button.wait.active { background:#e6e9ed; color:var(--text); }
    .answer-switch button.yes.active { background:var(--ok-soft); color:var(--ok); }
    .answer-switch button.no.active { background:var(--accent-soft); color:var(--accent); }
    .notes-label { display:block; margin-top:8px; font-size:12px; font-weight:750; }
    .notes-label textarea { width:100%; min-height:84px; resize:vertical; margin-top:6px; border:1px solid var(--line); border-radius:5px; padding:9px; background:var(--surface); color:var(--text); }
    .review-nav { display:grid; grid-template-columns:38px 1fr 38px; gap:8px; margin-top:14px; }
    .review-nav button { min-height:38px; border:1px solid var(--line); border-radius:5px; background:var(--surface); color:var(--text); font-weight:750; }
    .review-nav button.primary { border-color:var(--text); background:var(--text); color:#fff; }
    .review-nav button:disabled { cursor:not-allowed; opacity:.38; }
    .row-complete { margin-top:12px; padding:9px 10px; border:1px solid var(--line); border-radius:5px; color:var(--muted); font-size:12px; }
    .row-complete.complete { border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); background:var(--ok-soft); color:var(--ok); }
    .row-complete.held { border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); background:var(--accent-soft); color:var(--accent); }
    .fatal { padding:40px; color:var(--accent); }

    @media (max-width:1100px) {
      .workspace { grid-template-columns:240px minmax(390px,1fr) 300px; }
      .story-inner { padding-inline:26px; }
      .story h1 { font-size:24px; }
    }
    @media (max-width:880px) {
      :root { --header-h:58px; }
      .topbar { grid-template-columns:1fr auto; padding:0 14px; }
      .seat-switch { width:176px; }
      .top-actions { display:none; }
      .statusbar { padding-inline:14px; }
      .workspace { display:block; border-inline:0; }
      .queue,.rubric { border:0; }
      .queue { border-bottom:1px solid var(--line); }
      .issue-list { display:flex; max-height:none; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x proximity; }
      .issue-button { flex:0 0 230px; min-height:82px; border-right:1px solid var(--line); scroll-snap-align:start; }
      .story-inner { padding:28px 18px 36px; }
      .rubric { border-top:1px solid var(--line); }
      .rubric-body { max-width:600px; margin:0 auto; padding:18px; }
    }
    @media (max-width:560px) {
      .brand-name span { display:none; }
      .seat-switch { width:152px; height:34px; }
      .statusbar { grid-template-columns:1fr; gap:3px; }
      .save-state { white-space:normal; }
      .story h1 { font-size:22px; }
      .story-lead { font-size:16px; }
      .brief-row { grid-template-columns:1fr; gap:4px; }
      .source-row { grid-template-columns:76px 1fr; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <div class="login-shell" id="gate">
    <form class="login-panel" id="loginForm">
      <h1>편집 데스크</h1>
      <p>관리자 토큰으로 입장합니다.</p>
      <input id="tokenInput" type="password" autocomplete="current-password" aria-label="관리자 토큰">
      <button type="submit">입장</button>
      <div class="login-error" id="loginError" role="alert"></div>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <a class="brand" href="/admin.html#dev-local-edition">
        <span class="brand-mark">N</span>
        <span class="brand-name">지금핫 <span>편집 데스크</span></span>
      </a>
      <div class="seat-switch" aria-label="독립 검수자 선택">
        <button type="button" data-seat="reviewer-a">검수자 A</button>
        <button type="button" data-seat="reviewer-b">검수자 B</button>
      </div>
      <div class="top-actions">
        <a href="/admin.html#dev-local-edition">개발관리</a>
        <button type="button" id="logoutButton">로그아웃</button>
      </div>
    </header>
    <div class="statusbar">
      <div class="packet-meta" id="packetMeta"></div>
      <div class="save-state" id="saveState" aria-live="polite"></div>
    </div>
    <main class="workspace">
      <aside class="queue">
        <div class="pane-head">
          <div class="pane-head-row"><h2>검수 목록</h2><strong id="progressText">0/0</strong></div>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
        </div>
        <div class="filter-tabs" id="filterTabs">
          <button type="button" data-filter="all">전체</button>
          <button type="button" data-filter="remaining">미완료</button>
          <button type="button" data-filter="held">보류</button>
        </div>
        <div class="issue-list" id="issueList"></div>
      </aside>
      <article class="story" id="storyPane"></article>
      <aside class="rubric" id="rubricPane"></aside>
    </main>
  </div>

  <script>
    let token=localStorage.getItem("admin_token")||"";
    const params=new URLSearchParams(location.search);
    const queryToken=params.get("token");
    if(queryToken){ token=queryToken; localStorage.setItem("admin_token",token); params.delete("token"); history.replaceState(null,"",`${location.pathname}${params.toString()?`?${params}`:""}${location.hash}`); }

    const state={
      reviewerId:params.get("reviewer")==="reviewer-b"?"reviewer-b":"reviewer-a",
      data:null,
      currentBlindId:null,
      filter:"remaining",
      saveTimer:null,
      saving:false,
      dirty:false,
      saveError:false,
      saveMessage:""
    };

    function esc(value){ return String(value==null?"":value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char])); }
    function safeUrl(value){ try{ const url=new URL(value); return /^https?:$/.test(url.protocol)?url.href:""; }catch{return "";} }
    function when(value){ if(!value)return ""; const date=new Date(value); return Number.isNaN(date.valueOf())?"":date.toLocaleString("ko-KR"); }
    function categoryText(ids){ return (ids||[]).join(" · ")||"분야 미지정"; }

    async function api(path,options={}){
      const response=await fetch(path,{...options,headers:{"content-type":"application/json","x-admin-token":token,...(options.headers||{})}});
      if(response.status===401) throw Object.assign(new Error("인증 실패"),{auth:true});
      if(!response.ok) throw new Error((await response.json().catch(()=>({}))).error||String(response.status));
      return response.json();
    }

    function annotationComplete(annotation){ return state.data.reviewFields.every(field=>typeof annotation[field.id]==="boolean"); }
    function annotationHeld(annotation){ return state.data.reviewFields.some(field=>annotation[field.id]===false); }
    function filteredRows(){
      if(!state.data)return [];
      if(state.filter==="remaining")return state.data.rows.filter(row=>!annotationComplete(row.annotation));
      if(state.filter==="held")return state.data.rows.filter(row=>annotationHeld(row.annotation));
      return state.data.rows;
    }
    function currentRow(){ return state.data&&state.data.rows.find(row=>row.blindId===state.currentBlindId)||null; }
    function chooseCurrent(){
      if(currentRow())return;
      const remaining=state.data.rows.find(row=>!annotationComplete(row.annotation));
      state.currentBlindId=(remaining||state.data.rows[0]||{}).blindId||null;
    }

    function renderSeats(){
      document.querySelectorAll("[data-seat]").forEach(button=>button.classList.toggle("active",button.dataset.seat===state.reviewerId));
    }
    function renderPacket(){
      const packet=state.data.packet;
      document.getElementById("packetMeta").innerHTML=`<strong>${esc(packet.sourceDate||"날짜 미상")} · ${esc(packet.sourceSlotId||"슬롯 미상")}</strong><span>${esc(packet.packetId)}</span><span>${esc(packet.issueCount)}건</span><span>상대 답 비공개</span>`;
    }
    function renderProgress(){
      const completed=state.data.rows.filter(row=>annotationComplete(row.annotation)).length;
      const total=state.data.rows.length;
      document.getElementById("progressText").textContent=`${completed}/${total}`;
      document.getElementById("progressBar").style.width=`${total?completed/total*100:0}%`;
      document.querySelectorAll("[data-filter]").forEach(button=>button.classList.toggle("active",button.dataset.filter===state.filter));
    }
    function renderIssueList(){
      const rows=filteredRows();
      document.getElementById("issueList").innerHTML=rows.length?rows.map(row=>{
        const complete=annotationComplete(row.annotation);
        const held=annotationHeld(row.annotation);
        return `<button type="button" class="issue-button${row.blindId===state.currentBlindId?" active":""}" data-issue="${esc(row.blindId)}"><span class="issue-number">${String(row.position).padStart(2,"0")}</span><span class="issue-copy"><span class="issue-category">${esc(categoryText(row.categoryIds))}</span><span class="issue-title">${esc(row.reader.headline||row.canonical.headline)}</span></span><span class="issue-state${held?" held":complete?" complete":""}" aria-label="${held?"보류":complete?"완료":"미완료"}"></span></button>`;
      }).join(""):`<div class="queue-empty">해당 항목이 없습니다.</div>`;
    }
    function renderStory(){
      const row=currentRow();
      if(!row){ document.getElementById("storyPane").innerHTML='<div class="fatal">검수할 항목이 없습니다.</div>'; return; }
      const reader=row.reader||{};
      const sources=(row.sourceEvidence||[]).map(source=>{
        const url=safeUrl(source.canonicalUrl);
        const title=esc(source.title||"원문 근거");
        return `<div class="source-row"><b>${esc(source.sourceLabel||"출처")}</b><span>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${title}</a>`:title}</span></div>`;
      }).join("")||'<div class="source-row"><b>출처</b><span>표시할 원문 링크가 없습니다.</span></div>';
      document.getElementById("storyPane").innerHTML=`<div class="story-inner"><div class="story-kicker"><span>${String(row.position).padStart(2,"0")}</span><span class="tag">${esc(categoryText(row.categoryIds))}</span>${reader.confidenceLabel?`<span class="tag">${esc(reader.confidenceLabel)}</span>`:""}</div><h1>${esc(reader.headline||row.canonical.headline)}</h1><p class="story-lead">${esc(reader.summary||row.canonical.paragraph)}</p><dl class="brief-grid"><div class="brief-row"><dt>왜 중요한가</dt><dd>${esc(reader.whyImportant||"—")}</dd></div><div class="brief-row"><dt>지금 나온 이유</dt><dd>${esc(reader.whyNow||"—")}</dd></div><div class="brief-row"><dt>지난 브리핑과 비교</dt><dd>${esc(reader.change||"—")}</dd></div><div class="brief-row"><dt>다음 확인</dt><dd>${esc(reader.watchNext||"—")}</dd></div></dl><section class="sources"><h2>출처</h2>${sources}</section><details class="canonical"><summary>저장 원본 대조</summary><div class="canonical-body"><b>주제</b><p>${esc(row.canonical.subject||"—")}</p><b>헤드라인</b><p>${esc(row.canonical.headline||"—")}</p><b>문단</b><p>${esc(row.canonical.paragraph||"—")}</p><b>근거 해시</b><p>${esc(row.evidenceHash||"—")}</p></div></details></div>`;
    }
    function renderRubric(){
      const row=currentRow();
      if(!row){ document.getElementById("rubricPane").innerHTML=""; return; }
      const complete=annotationComplete(row.annotation);
      const held=annotationHeld(row.annotation);
      const rows=state.data.reviewFields.map(field=>{
        const value=row.annotation[field.id];
        return `<div class="review-item"><b>${esc(field.label)}</b><p>${esc(field.question)}</p><div class="answer-switch" role="group" aria-label="${esc(field.label)}"><button type="button" class="wait${value==null?" active":""}" data-review-field="${esc(field.id)}" data-review-value="">미판정</button><button type="button" class="yes${value===true?" active":""}" data-review-field="${esc(field.id)}" data-review-value="true">예</button><button type="button" class="no${value===false?" active":""}" data-review-field="${esc(field.id)}" data-review-value="false">아니오</button></div></div>`;
      }).join("");
      const currentIndex=state.data.rows.findIndex(item=>item.blindId===row.blindId);
      document.getElementById("rubricPane").innerHTML=`<div class="pane-head"><h2>판정</h2><p>${esc(state.reviewerId==="reviewer-a"?"검수자 A":"검수자 B")} · ${esc(row.blindId)}</p></div><div class="rubric-body">${rows}<label class="notes-label">메모<textarea id="reviewNotes" maxlength="500" placeholder="아니오 판정의 근거를 남겨주세요.">${esc(row.annotation.notes||"")}</textarea></label><div class="row-complete${held?" held":complete?" complete":""}">${held?"보류 항목 있음":complete?"이 행 검수 완료":"미판정 항목 있음"}</div><div class="review-nav"><button type="button" data-nav="previous" title="이전 항목"${currentIndex<=0?" disabled":""}>&larr;</button><button type="button" class="primary" data-nav="next-incomplete">다음 미완료</button><button type="button" data-nav="next" title="다음 항목"${currentIndex>=state.data.rows.length-1?" disabled":""}>&rarr;</button></div></div>`;
    }
    function renderSaveState(){
      const element=document.getElementById("saveState");
      element.textContent=state.saveMessage||(state.data&&state.data.savedAt?`저장 ${when(state.data.savedAt)}`:"저장 내역 없음");
      element.classList.toggle("error",state.saveError);
    }
    function renderAll(){ renderSeats(); renderPacket(); renderProgress(); renderIssueList(); renderStory(); renderRubric(); renderSaveState(); }

    async function loadDesk(reviewerId=state.reviewerId){
      state.reviewerId=reviewerId;
      state.saveMessage="불러오는 중";
      state.saveError=false;
      renderSaveState();
      const data=await api(`/api/admin/editorial-desk?reviewerId=${encodeURIComponent(reviewerId)}`);
      state.data=data;
      state.currentBlindId=null;
      state.filter=data.progress.remaining?"remaining":"all";
      state.saveMessage=data.savedAt?`저장 ${when(data.savedAt)}`:"저장 내역 없음";
      chooseCurrent();
      const url=new URL(location.href); url.searchParams.set("reviewer",reviewerId); url.searchParams.delete("token"); history.replaceState(null,"",url);
      renderAll();
    }
    function queueSave(){
      state.dirty=true;
      state.saveMessage="저장 대기";
      state.saveError=false;
      renderSaveState();
      clearTimeout(state.saveTimer);
      state.saveTimer=setTimeout(flushSave,450);
    }
    async function flushSave(){
      if(!state.data||state.saving)return;
      state.saving=true;
      state.dirty=false;
      state.saveMessage="저장 중";
      renderSaveState();
      const snapshot=state.data.rows.map(row=>({
        blindId:row.blindId,
        ...Object.fromEntries(state.data.reviewFields.map(field=>[field.id,typeof row.annotation[field.id]==="boolean"?row.annotation[field.id]:null])),
        notes:String(row.annotation.notes||"").trim()
      }));
      try{
        const result=await api("/api/admin/editorial-review",{method:"POST",body:JSON.stringify({packetId:state.data.packet.packetId,editionId:state.data.packet.editionId,reviewerId:state.reviewerId,annotations:snapshot})});
        state.data.savedAt=result.savedAt;
        state.data.humanReview=result.humanReview;
        state.saveMessage=`저장 ${when(result.savedAt)}`;
        state.saveError=false;
      }catch(error){
        state.saveMessage=error.message;
        state.saveError=true;
        state.dirty=true;
      }finally{
        state.saving=false;
        renderSaveState();
        if(state.dirty&&!state.saveError)queueSave();
      }
    }
    function move(direction){
      const index=state.data.rows.findIndex(row=>row.blindId===state.currentBlindId);
      const next=state.data.rows[index+direction];
      if(next){ state.currentBlindId=next.blindId; renderAll(); }
    }
    function moveToNextIncomplete(){
      const rows=state.data.rows;
      const current=rows.findIndex(row=>row.blindId===state.currentBlindId);
      const next=[...rows.slice(current+1),...rows.slice(0,current)].find(row=>!annotationComplete(row.annotation));
      if(next){ state.currentBlindId=next.blindId; state.filter="remaining"; renderAll(); }
    }

    document.addEventListener("click",event=>{
      const seat=event.target.closest("[data-seat]");
      if(seat&&seat.dataset.seat!==state.reviewerId){ loadDesk(seat.dataset.seat).catch(showFatal); return; }
      const filter=event.target.closest("[data-filter]");
      if(filter){ state.filter=filter.dataset.filter; renderProgress(); renderIssueList(); return; }
      const issue=event.target.closest("[data-issue]");
      if(issue){ state.currentBlindId=issue.dataset.issue; renderAll(); return; }
      const review=event.target.closest("[data-review-field]");
      if(review){
        const row=currentRow();
        row.annotation[review.dataset.reviewField]=review.dataset.reviewValue==="true"?true:review.dataset.reviewValue==="false"?false:null;
        row.complete=annotationComplete(row.annotation);
        row.held=annotationHeld(row.annotation);
        renderProgress(); renderIssueList(); renderRubric(); queueSave();
        return;
      }
      const nav=event.target.closest("[data-nav]");
      if(nav){ if(nav.dataset.nav==="previous")move(-1); else if(nav.dataset.nav==="next")move(1); else moveToNextIncomplete(); }
    });
    document.addEventListener("input",event=>{
      if(event.target.id!=="reviewNotes")return;
      const row=currentRow();
      row.annotation.notes=event.target.value.slice(0,500);
      queueSave();
    });
    document.getElementById("logoutButton").onclick=()=>{ localStorage.removeItem("admin_token"); token=""; document.getElementById("app").hidden=true; document.getElementById("gate").hidden=false; };
    document.getElementById("loginForm").onsubmit=async event=>{
      event.preventDefault();
      token=document.getElementById("tokenInput").value.trim();
      try{ await api("/api/admin/stats"); localStorage.setItem("admin_token",token); document.getElementById("gate").hidden=true; document.getElementById("app").hidden=false; await loadDesk(); }
      catch(error){ document.getElementById("loginError").textContent="토큰이 올바르지 않습니다."; }
    };
    function showFatal(error){
      if(error&&error.auth){ localStorage.removeItem("admin_token"); document.getElementById("app").hidden=true; document.getElementById("gate").hidden=false; document.getElementById("loginError").textContent="다시 로그인해주세요."; return; }
      document.getElementById("app").hidden=false;
      document.getElementById("storyPane").innerHTML=`<div class="fatal">${esc(error&&error.message||"편집 데스크를 불러오지 못했습니다.")}</div>`;
    }

    if(token){ document.getElementById("gate").hidden=true; document.getElementById("app").hidden=false; loadDesk().catch(showFatal); }
  </script>
</body>
</html>
