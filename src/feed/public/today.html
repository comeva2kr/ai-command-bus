<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>지금핫 오늘판</title>
<script>
(function(){
  var key="feed_theme", media=matchMedia("(prefers-color-scheme: dark)");
  function apply(){
    var saved="system";
    try{ saved=localStorage.getItem(key)||"system"; }catch{}
    document.documentElement.dataset.theme=saved==="system"?(media.matches?"dark":"light"):saved;
  }
  apply();
  if(media.addEventListener) media.addEventListener("change",apply);
})();
</script>
<style>
:root{
  --bg:#f7f8fa;--paper:#ffffff;--ink:#15171c;--sub:#626873;--line:#d9dde4;
  --soft:#eef1f5;--blue:#2457d6;--red:#d83b32;--green:#157a55;--gold:#8a5a00;
  --header:rgba(255,255,255,.94);--shadow:0 10px 30px rgba(22,28,40,.08)
}
:root[data-theme="dark"]{
  --bg:#0e1014;--paper:#15181e;--ink:#f2f4f7;--sub:#9ca3af;--line:#303641;
  --soft:#20252e;--blue:#7ca0ff;--red:#ff766c;--green:#63c69c;--gold:#e0b75c;
  --header:rgba(14,16,20,.94);--shadow:0 12px 34px rgba(0,0,0,.3)
}
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:30;background:var(--header);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{height:64px;max-width:1160px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 248px;font-size:20px;font-weight:900;white-space:nowrap}
.brand svg{width:24px;height:24px;flex:0 0 24px}
.brand-copy{display:flex;align-items:baseline;gap:7px;min-width:0}
.brand-title{display:inline-flex;align-items:baseline;gap:6px}
.brand-identity{display:block;color:var(--sub);font-size:11px;font-weight:750}
.view-tabs{align-self:stretch;display:grid;grid-template-columns:repeat(2,minmax(58px,1fr));align-items:stretch;position:relative;margin-left:18px}
.view-tabs a{display:flex;align-items:center;justify-content:center;position:relative;padding:0 12px;color:var(--sub);font-weight:750;font-size:14px}
.view-tabs a[aria-current="page"]{color:var(--ink)}
.view-indicator{position:absolute;left:0;bottom:-1px;width:50%;height:3px;background:var(--red);transform:translateX(0);transition:transform .21s cubic-bezier(.22,.61,.36,1);pointer-events:none}
.view-tabs[data-active="live"] .view-indicator,.view-tabs[data-target="live"] .view-indicator{transform:translateX(100%)}
.view-tabs[data-target="today"] .view-indicator{transform:translateX(0)}
.icon-button{margin-left:auto;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer}
.icon-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.icon-button[aria-busy="true"] svg{animation:turn .8s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.page{max-width:1160px;margin:0 auto;padding:34px 22px 80px}
.edition-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:24px}
.date-line{font-size:12px;font-weight:800;color:var(--red);margin-bottom:7px}
.edition-head h1{font-size:34px;line-height:1.18;margin:0;font-weight:900}
.edition-lead{margin:9px 0 0;color:var(--sub);max-width:700px;font-size:15px}
.slot-tabs{display:grid;grid-template-columns:repeat(3,92px);border:1px solid var(--line);background:var(--paper);border-radius:6px;overflow:hidden;align-self:end}
.slot-tabs button{height:54px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px}
.slot-tabs button:last-child{border-right:0}
.slot-tabs button b{font-size:13px}.slot-tabs button span{font-size:11px;color:var(--sub)}
.slot-tabs button.active{background:var(--ink);color:var(--paper)}
.slot-tabs button.active span{color:color-mix(in srgb,var(--paper) 72%,transparent)}
.slot-tabs button:disabled{cursor:not-allowed;color:var(--muted);background:var(--soft)}
.category-band{padding:19px 0;border-bottom:1px solid var(--line)}
.band-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:12px}
.band-head h2{font-size:13px;margin:0;font-weight:850}.band-status{font-size:12px;color:var(--sub)}
.category-list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.category-list::-webkit-scrollbar{display:none}
.category-button{flex:0 0 auto;min-height:36px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--sub);font-size:13px;font-weight:750;cursor:pointer;white-space:nowrap}
.category-button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,790px) minmax(240px,1fr);gap:54px;align-items:start;margin-top:8px}
.issue-list{min-width:0}
.issue{display:grid;grid-template-columns:48px minmax(0,1fr);gap:18px;padding:28px 0 30px;border-bottom:1px solid var(--line)}
.issue-number{font-size:12px;font-weight:850;color:var(--sub);padding-top:5px}
.issue:first-child{padding-top:30px}
.issue:first-child .issue-number{color:var(--red)}
.issue-kicker{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:9px;font-size:11px;font-weight:800;color:var(--sub)}
.lane{color:var(--red)}.lane.coverage{color:var(--blue)}.lane.debate{color:var(--gold)}.lane.applause{color:var(--green)}
.separator{width:1px;height:11px;background:var(--line)}
.issue h2{font-size:24px;line-height:1.34;margin:0;font-weight:880;word-break:keep-all;overflow-wrap:anywhere}
.issue:first-child h2{font-size:29px}
.issue-summary{font-size:16px;line-height:1.72;margin:13px 0 0;color:var(--ink);word-break:keep-all}
.editorial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.editorial-point{padding:14px 15px 15px 0;min-width:0}
.editorial-point+ .editorial-point{border-left:1px solid var(--line);padding-left:15px}
.editorial-point b{display:block;font-size:11px;color:var(--sub);margin-bottom:5px}
.editorial-point p{margin:0;font-size:13px;line-height:1.55;word-break:keep-all}
.change-row{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}
.change-row b{color:var(--sub)}.change-row p{margin:0;line-height:1.55}
.evidence-row{display:flex;align-items:flex-start;gap:12px;margin-top:14px;font-size:12px}
.evidence-label{color:var(--sub);font-weight:800;flex:0 0 auto}
.source-links{display:flex;flex-wrap:wrap;gap:5px 12px;min-width:0}
.source-links a{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.rail{position:sticky;top:88px;padding-top:24px}
.rail-section{border-top:3px solid var(--ink);padding:14px 0 24px}
.rail-section+ .rail-section{border-top:1px solid var(--line)}
.rail h2{font-size:13px;margin:0 0 13px;font-weight:900}
.metric-list{display:grid;grid-template-columns:1fr auto;margin:0;gap:10px 14px;font-size:13px}
.metric-list dt{color:var(--sub)}.metric-list dd{margin:0;font-weight:850;text-align:right}
.selection-list{list-style:none;margin:0;padding:0}.selection-list li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.selection-list li:last-child{border-bottom:0}.selection-list span{color:var(--sub)}
.rail-link{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-weight:850;font-size:13px;color:var(--blue)}
.empty,.error{padding:60px 0;border-bottom:1px solid var(--line)}
.empty h2,.error h2{font-size:22px;margin:0 0 8px}.empty p,.error p{margin:0;color:var(--sub)}
.retry{margin-top:18px;width:42px;height:42px;border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;font-size:20px}
.skeleton{padding:32px 0;border-bottom:1px solid var(--line)}
.sk{height:12px;background:var(--soft);margin-bottom:10px;border-radius:3px;animation:pulse 1.3s ease-in-out infinite alternate}
.sk.title{height:28px;width:80%}.sk.body{width:94%}.sk.short{width:55%}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;font-size:13px;box-shadow:var(--shadow)}
.hidden{display:none!important}
@media(max-width:860px){
  .page{padding-top:26px}.layout{grid-template-columns:1fr;gap:22px}.rail{position:static;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-top:0}.rail-section+ .rail-section{border-top:3px solid var(--ink)}
}
@media(max-width:620px){
  .topbar-inner{height:58px;padding:0 16px;gap:14px}.brand{flex-basis:112px;font-size:18px}.brand-copy{display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.05}.brand-en{display:none}.brand-identity{font-size:10px}.view-tabs{margin-left:2px;grid-template-columns:repeat(2,minmax(50px,1fr))}.view-tabs a{padding:0 8px}.icon-button{width:34px;height:34px}
  .page{padding:22px 16px 64px}.edition-head{grid-template-columns:1fr;gap:18px}.edition-head h1{font-size:28px}.edition-lead{font-size:14px}
  .slot-tabs{grid-template-columns:repeat(3,1fr);width:100%}.category-band{margin-left:-16px;margin-right:-16px;padding-left:16px}.band-head{padding-right:16px}.category-list{padding-right:16px}
  .layout{margin-top:0}.issue{grid-template-columns:32px minmax(0,1fr);gap:10px;padding:23px 0 25px}.issue:first-child{padding-top:25px}.issue h2,.issue:first-child h2{font-size:21px;line-height:1.38}.issue-summary{font-size:15px;line-height:1.68}
  .editorial-grid{grid-template-columns:1fr}.editorial-point{padding:12px 0}.editorial-point+ .editorial-point{border-left:0;border-top:1px solid var(--line);padding-left:0}.change-row{grid-template-columns:1fr;gap:4px}.evidence-row{display:block}.evidence-label{display:block;margin-bottom:5px}
  .rail{grid-template-columns:1fr;gap:0}.rail-section+ .rail-section{border-top:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){.icon-button[aria-busy="true"] svg,.sk{animation:none}.view-indicator{transition:none}}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="지금핫 오늘판">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#15171c"/><path d="M5 23l7-5 5 2 7-12 4 4" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="8" r="2.5" fill="#ef4c43"/></svg>
      <span class="brand-copy"><span class="brand-title">지금핫 <span class="brand-en">NowHot</span></span><small class="brand-identity">맞춰가는 중</small></span>
    </a>
    <nav class="view-tabs" aria-label="보기 전환" data-view-switch data-active="today">
      <a href="/" data-view="today" aria-current="page">오늘</a>
      <a href="/live" data-view="live">실시간</a>
      <span class="view-indicator" aria-hidden="true"></span>
    </nav>
    <button class="icon-button" id="refresh" type="button" title="오늘판 새로고침" aria-label="오늘판 새로고침">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M19 11a7 7 0 1 0 1 5"/></svg>
    </button>
  </div>
</header>

<div class="page">
  <section class="edition-head" aria-labelledby="editionTitle">
    <div>
      <div class="date-line" id="dateLine">오늘판 준비 중</div>
      <h1 id="editionTitle">오늘의 브리핑</h1>
      <p class="edition-lead" id="editionLead">선택한 분야에서 지금 확인할 흐름을 정리하고 있습니다.</p>
    </div>
    <div class="slot-tabs" id="slots" role="tablist" aria-label="오늘 판본">
      <button type="button" data-slot="morning" role="tab"><b>모닝</b><span>07:00</span></button>
      <button type="button" data-slot="lunch" role="tab"><b>런치</b><span>12:00</span></button>
      <button type="button" data-slot="evening" role="tab"><b>이브닝</b><span>19:00</span></button>
    </div>
  </section>

  <section class="category-band" aria-labelledby="categoryTitle">
    <div class="band-head"><h2 id="categoryTitle">내 관심 분야</h2><span class="band-status" id="categoryStatus">불러오는 중</span></div>
    <div class="category-list" id="categories"></div>
  </section>

  <div class="layout">
    <section class="issue-list" id="issues" aria-live="polite">
      <div class="skeleton"><div class="sk title"></div><div class="sk body"></div><div class="sk short"></div></div>
      <div class="skeleton"><div class="sk title"></div><div class="sk body"></div><div class="sk short"></div></div>
      <div class="skeleton"><div class="sk title"></div><div class="sk body"></div><div class="sk short"></div></div>
    </section>
    <aside class="rail" aria-label="이번 판 요약">
      <section class="rail-section"><h2>이번 판</h2><dl class="metric-list" id="metrics"><dt>상태</dt><dd>준비 중</dd></dl></section>
      <section class="rail-section"><h2>선택 분야</h2><ul class="selection-list" id="selection"><li><span>불러오는 중</span><b>—</b></li></ul><a class="rail-link" href="/live"><span>실시간 피드 보기</span><span aria-hidden="true">→</span></a></section>
    </aside>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
const state={userId:null,categories:null,slot:null,editionDate:null,edition:null,loading:false};
const $=(id)=>document.getElementById(id);
const esc=(value)=>String(value??"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));

async function json(url,options={}){
  const response=await fetch(url,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});
  const body=await response.json().catch(()=>({}));
  if(!response.ok){const error=new Error(body.error||`HTTP ${response.status}`);error.code=body.code||null;error.status=response.status;error.body=body;throw error}
  return body;
}

function toast(message){
  const el=$("toast");el.textContent=message;el.classList.remove("hidden");
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),2200);
}

function formatKst(value){
  const date=new Date(value);
  return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(date);
}

function kstDate(value){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(value));
  const get=(type)=>parts.find((part)=>part.type===type)?.value||"";
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function lane(issue){
  if(issue.shape==="coverage") return ["coverage","핵심 흐름"];
  if(issue.shape==="debate") return ["debate","논쟁 중"];
  if(issue.shape==="applause") return ["applause","반응 급증"];
  if(issue.shape==="interest") return ["coverage","검색 급증"];
  return ["","주목할 흐름"];
}

function fulfillmentStateText(row){
  if(row?.state==="no_supply") return "공급 없음";
  if(row?.state==="no_qualified_supply") return "기계 유효 후보 없음";
  if(row?.state==="underfilled") return "보강 중";
  return "충족";
}

function renderCategories(edition){
  // 부분 서빙이면 칩의 선택 표시는 **사용자가 요청한 조합** 기준이다 —
  // 제공 조합(selection)만 쓰면 제외된 분야 선택이 화면에서 조용히 사라진다.
  const selected=new Set((edition.requestedCategories&&edition.requestedCategories.length
    ? edition.requestedCategories
    : edition.selection.categories.map((category)=>category.id)));
  $("categories").innerHTML=edition.availableCategories.map((category)=>`<button type="button" class="category-button" data-category="${esc(category.id)}" aria-pressed="${selected.has(category.id)}">${esc(category.label)}</button>`).join("");
  const fulfillment=edition.categoryFulfillment;
  if(fulfillment&&fulfillment.selectedCount){
    const rows=Array.isArray(fulfillment.rows)?fulfillment.rows:[];
    const labels=new Map(edition.availableCategories.map((category)=>[category.id,category.label]));
    const gaps=rows.length
      ? rows.filter((row)=>row.state!=="met").map((row)=>`${row.label} ${fulfillmentStateText(row)}`)
      : [
          ...(fulfillment.missingCategoryIds||[]).map((id)=>`${labels.get(id)||id} 공급 없음`),
          ...(fulfillment.noQualifiedCategoryIds||[]).map((id)=>`${labels.get(id)||id} 기계 유효 후보 없음`),
          ...(fulfillment.underfilledCategoryIds||[]).map((id)=>`${labels.get(id)||id} 보강 중`)
        ];
    $("categoryStatus").textContent=fulfillment.goalSatisfied
      ? `${fulfillment.selectedCount}개 분야 충족`
      : `${fulfillment.metCount}/${fulfillment.selectedCount}개 충족${gaps.length?` · ${gaps.join(" · ")}`:""}`;
  }else{
    $("categoryStatus").textContent=`${selected.size}개 선택 · ${edition.selection.mode==="preview"?"체험 구성":"개인 구성"}`;
  }
  for(const button of $("categories").querySelectorAll("button")){
    button.onclick=()=>toggleCategory(button.dataset.category);
  }
}

function renderIssues(edition){
  if(!edition.issues.length){
    $("issues").innerHTML=`<div class="empty"><h2>이번 판은 아직 정리 중입니다</h2><p>선택 분야의 유효 후보가 더 모이면 같은 자리에서 이어집니다.</p></div>`;
    return;
  }
  $("issues").innerHTML=edition.issues.map((issue,index)=>{
    const copy=issue.reader||{};
    const watchNext=copy.watchNext||issue.watchNext||"";
    const [laneClass,laneLabel]=lane(issue);
    const cats=(issue.categoryIds||[]).map((id)=>edition.availableCategories.find((category)=>category.id===id)?.label||id).join(" · ");
    const refLabels=new Set((issue.refs||[]).map((ref)=>ref.sourceLabel));
    const linked=(issue.refs||[]).map((ref)=>`<a href="/live#post-${encodeURIComponent(ref.id)}" title="${esc(ref.title)}">${esc(ref.sourceLabel)}</a>`);
    const observed=(issue.evidence?.sources||[]).filter((source)=>!refLabels.has(source.label)).map((source)=>`<span>${esc(source.label)}</span>`);
    const sources=[...linked,...observed].join("");
    return `<article class="issue">
      <div class="issue-number">${String(index+1).padStart(2,"0")}</div>
      <div>
        <div class="issue-kicker"><span class="lane ${laneClass}">${laneLabel}</span><span class="separator"></span><span>${esc(cats)}</span><span class="separator"></span><span>${esc(copy.confidenceLabel||issue.confidence?.label||"")}</span></div>
        <h2>${esc(copy.headline||issue.headline)}</h2>
        <p class="issue-summary">${esc(copy.summary||issue.paragraph)}</p>
        <div class="editorial-grid">
          <div class="editorial-point"><b>왜 중요한가</b><p>${esc(copy.whyImportant||issue.whyImportant)}</p></div>
          <div class="editorial-point"><b>지금 주목할 이유</b><p>${esc(copy.whyNow||issue.whyHot)}</p></div>
        </div>
        <div class="change-row"><b>새로 달라진 점</b><p>${esc(copy.change||issue.changedSincePrevious||"지난 브리핑과 비교할 정보를 준비하고 있습니다.")}</p></div>
        ${watchNext?`<div class="change-row"><b>다음 확인</b><p>${esc(watchNext)}</p></div>`:""}
        <div class="evidence-row"><span class="evidence-label">출처</span><span class="source-links">${sources||"추가 확인 중"}</span></div>
      </div>
    </article>`;
  }).join("");
}

function renderRail(edition){
  const fixture=edition.candidateContract?.metrics||{};
  const change=edition.continuityProjection||edition.editionChange||{};
  const changeCounts=change.counts||{};
  const changeMetrics=(changeCounts.baseline??0)>0
    ? `<dt>첫 저장 기준선</dt><dd>${changeCounts.baseline}건</dd>`
    : `<dt>새 사건</dt><dd>${changeCounts.new??0}건</dd><dt>실질 변화</dt><dd>${changeCounts.material_update??0}건</dd>`;
  const fulfillment=edition.categoryFulfillment;
  const personalization=edition.personalization||null;
  const personalizationMetric=personalization
    ? `<dt>편성 기준</dt><dd>${personalization.mode==="bounded_category_affinity_reorder"?"개인 순서":"공유 중요도"}</dd>`
    : "";
  const fulfillmentMetric=fulfillment
    ? `<dt>선택 분야 충족</dt><dd>${fulfillment.metCount}/${fulfillment.selectedCount}</dd>`
    : "";
  const servingMetric=edition.serving
    ? `<dt>제공 상태</dt><dd>${edition.serving.fallback?"검증 이전판":"현재판 검증"}</dd>`
    : "";
  $("metrics").innerHTML=`
    ${servingMetric}
    <dt>편집 이슈</dt><dd>${edition.issues.length}건</dd>
    ${fulfillmentMetric}
    ${personalizationMetric}
    ${changeMetrics}
    <dt>반복 보류</dt><dd>${change.heldRepeatCount??0}건</dd>
    <dt>편집 후보</dt><dd>${fixture.candidateCount??0}건</dd>
    <dt>관측 출처</dt><dd>${edition.sourceCount}곳</dd>
    <dt>해외 흐름</dt><dd>${edition.overseasShare}%</dd>
    <dt>새 LLM 호출</dt><dd>${edition.llmCalls}회</dd>`;
  const counts=new Map();
  for(const issue of edition.issues) for(const category of issue.categoryIds||[]) counts.set(category,(counts.get(category)||0)+1);
  const fulfillmentRows=new Map((fulfillment?.rows||[]).map((row)=>[row.categoryId,row]));
  $("selection").innerHTML=edition.selection.categories.map((category)=>{
    const row=fulfillmentRows.get(category.id);
    const value=row?.state==="no_supply"?"공급 없음":row?.state==="no_qualified_supply"?"기계 유효 후보 없음":row?.state==="underfilled"?`${row.issueCount}/${row.target} 보강 중`:`${counts.get(category.id)||0}개 이슈`;
    return `<li><span>${esc(category.label)}</span><b>${esc(value)}</b></li>`;
  }).join("");
}

function render(edition){
  const requestedSlot=edition.serving?.requestedSlotId||edition.slot.id;
  const requestedDate=edition.serving?.requestedDate||edition.editionDate||kstDate(edition.generatedAt);
  const slotLabel={morning:"모닝",lunch:"런치",evening:"이브닝"};
  state.edition=edition;state.categories=edition.selection.categories.map((category)=>category.id);state.slot=requestedSlot;state.editionDate=requestedDate;
  // 폴백 고지는 generatedAt이 아니라 **serving 영수증(servedDate·servedSlotId)**
  // 기준으로 말한다 (David 확정 지시 2026-08-13): 제공된 실제 날짜·슬롯·
  // "최신판 아님"이 화면에서 명확해야 한다. 예: "8월 12일 이브닝판을
  // 보여드리고 있습니다."
  const servedSlotId=edition.serving?.servedSlotId||edition.slot.id;
  // 형식 검증 없이 Intl.format에 넣으면 Invalid Date에서 RangeError로 렌더
  // 전체가 죽는다(검수 P2) — YYYY-MM-DD일 때만 라벨을 만든다.
  const servedDateLabel=/^\d{4}-\d{2}-\d{2}$/.test(edition.serving?.servedDate||"")
    ? new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric"})
        .format(new Date(`${edition.serving.servedDate}T00:00:00+09:00`))
    : null;
  $("dateLine").textContent=edition.serving?.fallback
    ? `${servedDateLabel?servedDateLabel+" ":""}${slotLabel[servedSlotId]||edition.slot.label}판을 보여드리고 있습니다 · 최신 ${slotLabel[requestedSlot]||"새"}판은 검수 중`
    : `${formatKst(edition.generatedAt)} · ${edition.slot.label}판`;
  $("editionTitle").textContent=edition.serving?.fallback?`검증된 ${edition.slot.label} 브리핑`:`${edition.slot.label} 오늘판`;
  const choice=edition.selection.categories.map((category)=>category.label).join(" · ");
  const fulfillment=edition.categoryFulfillment;
  if(edition.serving?.fallback){
    $("editionLead").textContent=`새 ${slotLabel[requestedSlot]||"다음"}판이 검수 기준을 통과할 때까지 ${choice}의 가장 최근 검증판을 보여드립니다.`;
  }else if(edition.partial&&Array.isArray(edition.withheldCategories)&&edition.withheldCategories.length){
    // S3b 부분 서빙 — 제외 분야를 조용히 숨기지 않는다. 사유 문구는 서버가
    // 만든 그대로(미래 보장 표현 없음, David 확정 지시 2026-08-13).
    $("editionLead").textContent=`${choice}에서 ${edition.issues.length}개 흐름을 직접 정리했습니다. `+
      edition.withheldCategories.map((w)=>w.reason).join(" ");
  }else if(fulfillment&&!fulfillment.goalSatisfied){
    const gaps=fulfillment.rows.filter((row)=>row.state!=="met").map((row)=>row.label).join(" · ");
    $("editionLead").textContent=`${choice} 중 ${fulfillment.metCount}/${fulfillment.selectedCount}개 분야에서 ${edition.issues.length}개 흐름을 정리했습니다. ${gaps||"일부 분야"}는 검증 가능한 재료를 보강 중입니다.`;
  }else{
    $("editionLead").textContent=`${choice}에서 지금 확인할 ${edition.issues.length}개 흐름을 직접 정리했습니다.`;
  }
  const kstHour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hour:"2-digit",hourCycle:"h23"}).format(new Date()));
  const today=kstDate(new Date());
  const editionDate=requestedDate;
  for(const button of $("slots").querySelectorAll("button")){
    const active=button.dataset.slot===requestedSlot;button.classList.toggle("active",active);button.setAttribute("aria-selected",String(active));
    const hour={morning:7,lunch:12,evening:19}[button.dataset.slot];
    button.disabled=editionDate>today||(editionDate===today&&hour>kstHour);
  }
  renderCategories(edition);renderIssues(edition);renderRail(edition);
}

function renderError(error){
  if(error.code==="EDITORIAL_EDITION_NOT_SERVEABLE"){
    const serving=error.body?.serving||{};
    const availableCategories=Array.isArray(serving.availableCategories)?serving.availableCategories:[];
    const selectedIds=Array.isArray(serving.selectedCategories)?serving.selectedCategories:[];
    const selectedCategories=selectedIds.map((id)=>availableCategories.find((category)=>category.id===id)||{id,label:id});
    if(selectedCategories.length&&availableCategories.length){
      state.categories=selectedIds;
      state.slot=serving.requestedSlotId||state.slot;
      state.editionDate=serving.requestedDate||state.editionDate;
      renderCategories({
        selection:{categories:selectedCategories,mode:"saved"},
        availableCategories,
        categoryFulfillment:serving.fulfillment||null
      });
      $("selection").innerHTML=selectedCategories.map((category)=>`<li><span>${esc(category.label)}</span><b>검수 중</b></li>`).join("");
      for(const button of $("slots").querySelectorAll("button")){
        const active=button.dataset.slot===state.slot;
        button.classList.toggle("active",active);
        button.setAttribute("aria-selected",String(active));
      }
    }else{
      $("categoryStatus").textContent="검증 완료 대기";
      $("selection").innerHTML=`<li><span>선택 분야</span><b>검수 중</b></li>`;
    }
    $("dateLine").textContent="검수 완료 대기";
    $("editionTitle").textContent="새 브리핑을 검수 중입니다";
    $("editionLead").textContent="기준을 통과한 내용만 보여드리기 위해 현재판을 다시 확인하고 있습니다.";
    $("metrics").innerHTML=`<dt>상태</dt><dd>검수 보류</dd><dt>이전 검증판</dt><dd>없음</dd>`;
    $("issues").innerHTML=`<div class="empty"><h2>아직 보여드릴 검증판이 없습니다</h2><p>현재판과 최근 24시간의 이전판이 모두 제공 기준을 통과하지 못했습니다.</p><button class="retry" type="button" title="다시 확인" aria-label="다시 확인">↻</button></div>`;
    $("issues").querySelector("button").onclick=()=>loadEdition(true,state.editionDate);
    return;
  }
  $("issues").innerHTML=`<div class="error"><h2>오늘판을 불러오지 못했습니다</h2><p>${esc(error.message)}</p><button class="retry" type="button" title="다시 시도" aria-label="다시 시도">↻</button></div>`;
  $("issues").querySelector("button").onclick=()=>loadEdition(true);
}

async function loadEdition(announce=false,targetDate=null){
  if(state.loading)return;state.loading=true;$("refresh").setAttribute("aria-busy","true");
  try{
    const query=new URLSearchParams();
    if(state.userId)query.set("userId",state.userId);
    if(state.categories&&state.categories.length)query.set("categories",state.categories.join(","));
    if(state.slot)query.set("slot",state.slot);
    if(targetDate)query.set("date",targetDate);
    const edition=await json(`/api/today?${query}`);render(edition);if(announce)toast("오늘판을 새로 정리했습니다");
  }catch(error){renderError(error)}finally{state.loading=false;$("refresh").setAttribute("aria-busy","false")}
}

async function toggleCategory(category){
  const next=new Set(state.categories||[]);
  if(next.has(category)){if(next.size===1){toast("관심 분야를 하나 이상 남겨주세요");return}next.delete(category)}else next.add(category);
  state.categories=[...next];
  try{
    await json("/api/today/categories",{method:"POST",body:JSON.stringify({userId:state.userId,categories:state.categories})});
    await loadEdition(false,state.editionDate);
  }catch(error){toast(error.message)}
}

for(const button of $("slots").querySelectorAll("button"))button.onclick=()=>{state.slot=button.dataset.slot;loadEdition(false,state.editionDate)};
$("refresh").onclick=()=>loadEdition(true,state.editionDate);

function setupViewSwitch(){
  const nav=document.querySelector("[data-view-switch]");
  if(!nav)return;
  for(const link of nav.querySelectorAll("a[data-view]"))link.addEventListener("click",(event)=>{
    if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const target=link.dataset.view;
    if(target===nav.dataset.active||nav.dataset.switching){event.preventDefault();return}
    event.preventDefault();
    nav.dataset.switching="true";
    nav.dataset.target=target;
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(()=>location.assign(link.href),reduced?0:210);
  });
}
setupViewSwitch();

(async function init(){
  try{
    const saved=localStorage.getItem("feed_uid");
    const session=await json("/api/session",{method:"POST",body:JSON.stringify({userId:saved})});
    state.userId=session.userId;localStorage.setItem("feed_uid",session.userId);
    if(Array.isArray(session.briefingCategories)&&session.briefingCategories.length)state.categories=session.briefingCategories;
    await loadEdition();
  }catch(error){renderError(error)}
})();
</script>
