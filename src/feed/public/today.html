<style>

const todayAdOffset=Math.floor(Math.random()*997);
function todaySnapshot(){
  return {userId:state.userId,edition:state.edition,pinnedEdition:state.pinnedEdition,y:$("issueDetail").classList.contains("open")?state.listScrollY:window.scrollY};
}
function saveTodayNavigation(){
  if(state.edition)todayHistory.save(todaySnapshot(),$("issueDetail").querySelector(".detail-panel").scrollTop);
}
function issueDetailFromHash(){
  try{
    const match=location.hash.match(/^#issue-([^/]+)\/([^/]+)$/);
    return match?{editionId:decodeURIComponent(match[1]),issueId:decodeURIComponent(match[2])}:null;
  }catch{return null}
}
function restoreTodayDetail(){
  const detail=issueDetailFromHash();
  if(!detail || detail.editionId!==state.edition?.editionId)return false;
  const index=state.edition.issues.findIndex(issue=>(issue.evidenceHash||issue.id||issue.clusterId)===detail.issueId);
  if(index<0)return false;
  openIssueDetail(index);return true;
}
addEventListener("pagehide",saveTodayNavigation);
addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveTodayNavigation()});
addEventListener("pageshow",event=>{if(event.persisted)restoreTodayDetail()});

function externalHref(value){
  try{const url=new URL(value);return url.protocol==="http:"||url.protocol==="https:"?url.href:null}catch{return null}
}

function directSourceUrl(value){
  const href=externalHref(value);
  if(!href)return null;
  try{const hostname=new URL(href).hostname.toLowerCase();return hostname==="news.google.com"||hostname.endsWith(".news.google.com")?null:href}catch{return null}
}

function publisherKey(value){
  return String(value||"").normalize("NFKC").toLowerCase().replace(/[\s._-]+/g,"");
}

function usableArticleImage(value){
  const href=externalHref(value);
  if(!href)return null;
  try{
    const url=new URL(href);
    if(/^(?:lh\d+\.googleusercontent\.com|encrypted-tbn\d*\.gstatic\.com)$/i.test(url.hostname))return null;
    if(url.hostname==="ssl.gstatic.com"&&/\/news\//i.test(url.pathname))return null;
    return href;
  }catch{return null}
}

function meaningfulSummary(value,title){
  const text=String(value||"").replace(/\s+/g," ").trim();
  if(text.length<24||/(상위 (?:목록|리스트)에|제목이 올라 (?:있다|왔다)|관련 보도 묶음 신호|직접 확인한 원문은)/.test(text))return false;
  const normalized=(input)=>String(input||"").toLowerCase().replace(/[\s"'“”‘’·:,.!?…()\[\]{}\-]/g,"");
  const body=normalized(text),heading=normalized(title);
  return !heading||body!==heading&&!(heading.length>12&&body.includes(heading)&&body.length<heading.length+25);
}

function firstMeaningfulExcerpt(rows,title){
  for(const row of rows){
    const text=String(row.item?.summary||row.summary||row.excerpt||row.description||"").replace(/\s+/g," ").trim();
    if(!meaningfulSummary(text,title))continue;
    return text.slice(0,200).trim();
  }
  return "";
}

async function json(url,options={}){
  const response=await fetch(url,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});
  const body=await response.json().catch(()=>({}));
  if(!response.ok){const error=new Error(body.error||`HTTP ${response.status}`);error.code=body.code||null;error.status=response.status;error.body=body;throw error}
  return body;
}

function toast(message){
  const el=$("toast");el.textContent=message;el.classList.remove("hidden");
  clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add("hidden"),2200);
}

function formatKst(value){
  const date=new Date(value);
  return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).format(date);
}
function formatListKst(value){
  return new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",year:"numeric",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(value));
}

function kstDate(value){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(value));
  const get=(type)=>parts.find((part)=>part.type===type)?.value||"";
  return `${get("year")}-${get("month")}-${get("day")}`;
}

function lane(issue){
  if(issue.shape==="coverage") return ["coverage","핵심 흐름"];
  if(issue.shape==="debate") return ["debate","논쟁 중"];
  if(issue.shape==="applause") return ["applause","반응 급증"];
  if(issue.shape==="interest") return ["coverage","검색 급증"];
  return ["","주목할 흐름"];
}

function fulfillmentStateText(row){
  if(row?.state==="no_supply") return "공급 없음";
  if(row?.state==="no_qualified_supply") return "기계 유효 후보 없음";
  if(row?.state==="underfilled") return "보강 중";
  return "충족";
}

function sourceTranslationHtml(issue,sources){
  // 출처 목록은 그대로 두고 같은 기사의 번역 메타데이터만 읽는다.
  const metadata=(rows,source)=>{
    const eligible=(rows||[]).filter((row)=>row&&row.evidenceRole!=="related_observation");
    const byId=source.evidenceId?eligible.filter((row)=>(row.evidenceId||row.id)===source.evidenceId):[];
    const matches=byId.length?byId:eligible.filter((row)=>externalHref(row.url||row.canonicalUrl)===source.url);
    return matches.length===1?matches[0]:null;
  };
  const foreign=sources.map((source)=>{
    const url=directSourceUrl(source.url);
    if(!url||source.relay)return null;
    const parsed=new URL(url);
    if(parsed.username||parsed.password)return null;
    const prepared=metadata(issue.articleSummary?.sourceLinks,source);
    const original=metadata(issue.eventSources,source);
    const originalTitle=String(prepared?.originalTitle||"").trim()||String(original?.originalTitle||"").trim();
    const lang=String(prepared?.originalLang||original?.originalLang||"").trim().toLowerCase();
    const needsTranslation=originalTitle
      ? /\p{L}/u.test(originalTitle)&&!/\p{Script=Hangul}/u.test(originalTitle)
      : /^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$/.test(lang)&&!/^(?:ko|und|mul|zxx)(?:-|$)/.test(lang);
    return needsTranslation?{...source,url,originalTitle}:null;
  }).filter(Boolean);
  const source=foreign.find((row)=>row.evidenceId===issue.articleSummary?.sourceEvidenceId)||foreign[0];
  if(!source)return "";
  const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const href=mobile?`naversearchapp://inappbrowser?url=${encodeURIComponent(source.url)}&target=new&version=6`:source.url;
  const hint=mobile
    ? "네이버 앱에서 원문을 연 뒤 번역을 선택하세요. 앱이 열리지 않으면 아래 원문 링크를 이용할 수 있습니다."
    : "원문이 열리면 브라우저의 번역 기능을 선택하세요.";
  return `<div class="detail-translation">
    ${source.originalTitle?`<p class="detail-basis"><b>${esc(source.sourceLabel)} 원문 제목</b><br>${esc(source.originalTitle)}</p>`:""}
    <div class="detail-originals"><a id="detailTranslate" href="${esc(href)}" ${mobile?"":'rel="noopener noreferrer"'} aria-describedby="detailTranslationHint">${esc(source.sourceLabel)} ${mobile?"네이버 앱에서 번역":"원문 열고 번역"}</a></div>
    <p class="detail-basis" id="detailTranslationHint">${hint}</p>
  </div>`;
}

function issueSourceLinks(issue){
  const eventSources=issue.eventSources||[];
  const evidence=issue.sourceEvidence||[];
  const relatedUrls=new Set(evidence.filter((row)=>row?.evidenceRole==="related_observation").map((row)=>row.canonicalUrl).filter(Boolean));
  const summaryLinks=issue.articleSummary?.sourceLinks||[];
  const summaryPrepared=["ready","excerpt_only","source_unavailable"].includes(issue.articleSummary?.status);
  const rows=(summaryPrepared?summaryLinks:[...eventSources,...evidence,...(issue.refs||[])])
    .filter((row)=>row?.evidenceRole!=="related_observation"&&!relatedUrls.has(row?.url||row?.canonicalUrl));
  const seen=new Set();
  const normalized=rows.map((row)=>{
    const url=externalHref(row.url||row.canonicalUrl);
    const relay=Boolean(row.relay)||!directSourceUrl(url);
    const publisherLabel=String(row.sourceLabel||"원문").trim();
    const sourceGroup=String(row.sourceGroup||row.ownershipGroup||publisherKey(publisherLabel)).trim();
    const sourceEvent=eventSources.find((event)=>String(event.sourceGroup||event.ownershipGroup||publisherKey(event.sourceLabel)).trim()===sourceGroup);
    return {
      evidenceId:row.evidenceId||row.id||null,
      publisherLabel,
      publisherKey:publisherKey(publisherLabel),
      sourceGroup,
      sourceLabel:relay?`${publisherLabel} (Google 뉴스 중계)`:publisherLabel,
      title:row.title||"",
      summary:row.summary||row.excerpt||row.description||"",
      publishedAt:row.publishedAt||sourceEvent?.publishedAt||null,
      url,
      relay
    };
  }).filter((row)=>row.url);
  const directGroups=new Set(normalized.filter((row)=>!row.relay).map((row)=>row.sourceGroup));
  const seenGroups=new Set();
  return normalized.filter((row)=>!(row.relay&&directGroups.has(row.sourceGroup))&&
    !seen.has(row.url)&&seen.add(row.url)&&!seenGroups.has(row.sourceGroup)&&seenGroups.add(row.sourceGroup));
}

function renderCategories(edition){
  // 부분 서빙이면 칩의 선택 표시는 **사용자가 요청한 조합** 기준이다 —
  // 제공 조합(selection)만 쓰면 제외된 분야 선택이 화면에서 조용히 사라진다.
  const selected=new Set((edition.requestedCategories&&edition.requestedCategories.length
    ? edition.requestedCategories
    : edition.selection.categories.map((category)=>category.id)));
  $("categories").innerHTML=edition.availableCategories.map((category)=>`<button type="button" class="category-button" data-category="${esc(category.id)}" aria-pressed="${selected.has(category.id)}">${esc(category.label)}</button>`).join("");
  const fulfillment=edition.categoryFulfillment;
  if(fulfillment&&fulfillment.selectedCount){
    const rows=Array.isArray(fulfillment.rows)?fulfillment.rows:[];
    const labels=new Map(edition.availableCategories.map((category)=>[category.id,category.label]));
    const gaps=rows.length
      ? rows.filter((row)=>row.state!=="met").map((row)=>`${row.label} ${fulfillmentStateText(row)}`)
      : [
          ...(fulfillment.missingCategoryIds||[]).map((id)=>`${labels.get(id)||id} 공급 없음`),
          ...(fulfillment.noQualifiedCategoryIds||[]).map((id)=>`${labels.get(id)||id} 기계 유효 후보 없음`),
          ...(fulfillment.underfilledCategoryIds||[]).map((id)=>`${labels.get(id)||id} 보강 중`)
        ];
    $("categoryStatus").textContent=fulfillment.goalSatisfied
      ? `${fulfillment.selectedCount}개 분야 충족`
      : `${fulfillment.metCount}/${fulfillment.selectedCount}개 충족${gaps.length?` · ${gaps.join(" · ")}`:""}`;
  }else{
    $("categoryStatus").textContent=`${selected.size}개 선택 · ${edition.selection.mode==="preview"?"체험 구성":"개인 구성"}`;
  }
  for(const button of $("categories").querySelectorAll("button")){
    button.onclick=()=>toggleCategory(button.dataset.category);
  }
}

function todayAdHtml(issue,index,slot,seen=new Set(),nextIssue=null){
  if([issue,nextIssue].some(row=>row&&(row.adUnsafe||(row.categoryIds||[]).some(cat=>["politics","religion","adult"].includes(cat)))))return "";
  const cp=state.coupang;
  const items=(cp?.items||[]).filter(item=>/^https:\/\/link\.coupang\.com\//.test(item.href));
  if(!items.length||!cp.disclosure)return "";
  const categories=issue.categoryIds||[];
  const unused=items.filter(item=>!seen.has(item.dest||item.href));
  const related=categories.flatMap(cat=>({business:["tech","life"],news:["tech","life"],culture:["life"]}[cat]||[]));
  const matching=unused.filter(item=>categories.includes(item.category)||related.includes(item.category));
  const pool=matching.length?matching:unused.length?unused:items;
  const rotate=index+todayAdOffset;
  const item=pool[rotate%pool.length];seen.add(item.dest||item.href);
  const context={business:"news",news:"news",tech:"tech",gaming:"tech",humor:"fun",culture:"fun",sports:"hobby"}[categories[0]]||"life";
  const variants=cp.matrix?.[item.dest]?.[context];
  const copy=variants?.[rotate%variants.length]||{};
  const href=new URL(item.href);href.searchParams.set("subId",`${slot}-${index}`);
  const image=externalHref(item.img);
  return `<aside class="ad-slot ad-coupang" aria-label="쿠팡 제휴 광고">
    <p class="ad-mark">AD · 쿠팡 파트너스</p>
    <a class="ad-native" href="${esc(href.href)}" target="_blank" rel="nofollow sponsored noopener" referrerpolicy="unsafe-url">
      <span class="go-row"><span class="go-text"><b>${esc(copy.hook||item.hook)}</b><span class="go-line">${esc(copy.line||item.brand)}</span><span class="ad-go">${esc(copy.cta||"쿠팡에서 보기")} →</span><span class="go-dest">${esc(item.brand)}</span></span>
      ${image?`<span class="go-thumb"><img src="${esc(image)}" width="88" height="88" alt="${esc(item.brand)}" loading="eager" onerror="this.parentNode.remove()"></span>`:""}</span></a>
    <p class="ad-disclosure">${esc(cp.disclosure)}</p></aside>`;
}

function renderIssues(edition){
  if(!edition.issues.length){
    $("issues").innerHTML=`<div class="empty"><h2>이번 판은 아직 정리 중입니다</h2><p>선택 분야의 유효 후보가 더 모이면 같은 자리에서 이어집니다.</p></div>`;
    return;
  }
  const seenAds=new Set();
  $("issues").innerHTML=edition.issues.map((issue,index)=>{
    const copy=issue.reader||{};
    const watchNext=copy.watchNext||"";
    const change=copy.change||issue.changedSincePrevious||"";
    const [laneClass,laneLabel]=lane(issue);
    const cats=(issue.categoryIds||[]).map((id)=>edition.availableCategories.find((category)=>category.id===id)?.label||id).join(" · ");
    const directSources=issueSourceLinks(issue);
    const refLabels=new Set(directSources.map((row)=>row.sourceLabel));
    const linked=directSources.map((row)=>`<a href="${esc(row.url)}" rel="noopener noreferrer" title="${esc(row.title)}">${esc(row.sourceLabel)}</a>`);
    const observed=(issue.eventSources?.length?[]:issue.evidence?.sources||[]).filter((source)=>!refLabels.has(source.label)).map((source)=>`<span>${esc(source.label)}</span>`);
    const sources=[...linked,...observed].join("");
    const published=issue.firstPublishedAt?`<time class="published-time" datetime="${esc(issue.firstPublishedAt)}">${esc(formatListKst(issue.firstPublishedAt))} KST</time>`:"";
    return `<article class="issue" data-issue-index="${index}">
      <div class="issue-number">${String(index+1).padStart(2,"0")}</div>
      <div>
        <div class="issue-kicker"><span class="lane ${laneClass}">${laneLabel}</span><span class="separator"></span><span>${esc(cats)}</span>${sources?`<span class="separator"></span><span class="source-links">${sources}</span>`:""}${published?`<span class="separator"></span>${published}`:""}</div>
        <h2><button class="issue-title-button" type="button" data-open-issue="${index}" aria-label="${esc(copy.headline||issue.headline)} 기사 요약 열기" aria-controls="issueDetail" aria-expanded="false">${esc(copy.headline||issue.headline)}</button></h2>
        <div class="editorial-grid">
          <div class="editorial-point"><b>왜 중요한가</b><p>${esc(copy.whyImportant||issue.whyImportant)}</p></div>
        </div>
        ${change?`<div class="change-row"><b>새로 달라진 점</b><p>${esc(change)}</p></div>`:""}
        ${watchNext?`<div class="change-row"><b>다음 확인</b><p>${esc(watchNext)}</p></div>`:""}
      </div>
    </article>${index>=2&&(index-2)%10===0?todayAdHtml(issue,index,"today-feed",seenAds,edition.issues[index+1]):""}`;
  }).join("");
  for(const article of $("issues").querySelectorAll("article[data-issue-index]"))article.onclick=(event)=>{
    if(event.target.closest("a,button"))return;
    openIssueDetail(Number(article.dataset.issueIndex),article.querySelector("[data-open-issue]"));
  };
  for(const button of $("issues").querySelectorAll("[data-open-issue]"))button.onclick=()=>openIssueDetail(Number(button.dataset.openIssue),button);
}

function resetIssueDetail(){
  $("detailMeta").textContent="기사 요약";
  $("detailContent").innerHTML="";
}

function hideIssueDetail(){
  const overlay=$("issueDetail");
  if(!overlay.classList.contains("open"))return;
  state.detailRevision+=1;
  const returnFocus=state.detailReturnFocus;
  state.detailOpener?.setAttribute("aria-expanded","false");
  overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true");
  document.body.style.overflow="";
  state.detailOpener=null;state.detailReturnFocus=null;
  resetIssueDetail();
  returnFocus?.focus?.();
  window.scrollTo(0,state.listScrollY);
}
function closeIssueDetail(){
  if(todayHistory.current()?.view==="detail")history.back();else hideIssueDetail();
}

function openIssueDetail(index,returnFocus=null){
  const issue=state.edition?.issues?.[index];
  if(!issue)return;
  const detail={editionId:state.edition.editionId,issueId:issue.evidenceHash||issue.id||issue.clusterId};
  if(!detail.editionId||!detail.issueId)return;
  if($("issueDetail").classList.contains("open")&&JSON.stringify(todayHistory.current()?.detail)===JSON.stringify(detail))return;
  if(!$("issueDetail").classList.contains("open"))state.listScrollY=window.scrollY;
  const entry=todayHistory.open(detail,todaySnapshot(),`#issue-${encodeURIComponent(detail.editionId)}/${encodeURIComponent(detail.issueId)}`);
  state.listScrollY=todayHistory.snapshot()?.y||0;
  state.detailRevision+=1;
  const copy=issue.reader||{};
  const title=copy.headline||issue.headline;
  let articleSummary=issue.articleSummary||{};
  const categories=(issue.categoryIds||[]).map((id)=>state.edition.availableCategories.find((category)=>category.id===id)?.label||id).join(" · ");
  const directSources=issueSourceLinks(issue);
  const labels=[...new Set(directSources.map((row)=>row.sourceLabel).filter(Boolean))];
  state.detailReturnFocus=returnFocus||document.activeElement;
  state.detailOpener=returnFocus||document.activeElement;
  state.detailOpener?.setAttribute("aria-expanded","true");
  $("detailMeta").textContent=[categories,labels.join(" · ")].filter(Boolean).join("  |  ");
  $("issueDetail").classList.add("open");$("issueDetail").setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  if(!["ready","excerpt_only","source_unavailable"].includes(articleSummary.status)){
    articleSummary={status:"source_unavailable",unavailableReasonCode:articleSummary.unavailableReasonCode||"ARTICLE_SUMMARY_NOT_PREPARED"};
  }
  const resolvedSources=issueSourceLinks(issue);

  const readyText=["ready","excerpt_only"].includes(articleSummary.status)?String(articleSummary.textKo||"").replace(/\s+/g," ").trim():"";
  const excerpt=readyText?"":firstMeaningfulExcerpt(resolvedSources,title);
  const reason=Object.hasOwn(unavailableReasonKo,articleSummary.unavailableReasonCode)
    ? unavailableReasonKo[articleSummary.unavailableReasonCode]
    : "요약을 표시하지 못했습니다. 구체적인 사유는 확인되지 않았습니다.";
  const directSourceCount=resolvedSources.filter((row)=>!row.relay).length;
  const relaySourceCount=resolvedSources.filter((row)=>row.relay).length;
  const summarySourceCount=Number.isFinite(articleSummary.summarySourceCount)?articleSummary.summarySourceCount:0;
  const sourceLabel=articleSummary.sourceLabel||labels[0]||"확인 가능한";
  const storedFirstPublishedAt=Date.parse(issue.firstPublishedAt||"");
  const firstPublishedAt=Number.isFinite(storedFirstPublishedAt)?storedFirstPublishedAt:(resolvedSources.map((row)=>Date.parse(row.publishedAt)).filter(Number.isFinite).sort((a,b)=>a-b)[0]||null);
  const publishedHtml=firstPublishedAt?`<p class="detail-basis"><b>원문 표기 시각</b> ${esc(formatKst(firstPublishedAt))} (한국시간)</p>`:"";
  const sourceInventory=directSourceCount&&relaySourceCount
    ? `${directSourceCount}개 원문과 ${relaySourceCount}개 Google 뉴스 중계 링크를 표시합니다.`
    : directSourceCount
      ? `${directSourceCount}개 원문 링크를 표시합니다.`
      : relaySourceCount
        ? `${relaySourceCount}개 Google 뉴스 중계 링크만 확인됐습니다.`
        : "확인 가능한 원문 링크가 없습니다.";
  const basis=readyText
    ? articleSummary.status==="excerpt_only"
      ? articleSummary.excerptBasis==="publisher_feed_excerpt"
        ? `${sourceInventory} ${sourceLabel} 피드에서 제공한 공개 발췌입니다.`
        : `${sourceInventory} ${sourceLabel} 공개 원문에서 확인 가능한 핵심 구간을 발췌했습니다.`
      : `${sourceInventory} ${sourceLabel} 보도를 기준으로 공개 본문 ${summarySourceCount}곳을 대조해 요약했습니다.`
    : sourceInventory;
  const summaryHtml=readyText
    ? `<p>${esc(readyText)}</p>`
    : `<p class="detail-unavailable" role="status">${esc(reason)}</p>${excerpt?`<p class="detail-basis"><b>공개 발췌</b></p><p>${esc(excerpt)}</p>`:""}`;
  const summaryImage=articleSummary.unavailableReasonCode==="PUBLISHER_URL_UNAVAILABLE"?null:articleSummary.image;
  const preparedImages=(articleSummary.sourceLinks||[]).filter((row)=>!row.relay&&directSourceUrl(row.url||row.canonicalUrl)).map((row)=>row.image);
  const image=[summaryImage,...preparedImages,...(issue.eventSources||[]).filter((row)=>!row.relay&&directSourceUrl(row.url||row.canonicalUrl)).map((row)=>row.image)].map(usableArticleImage).find(Boolean)||null;
  const imageHtml=image
    ? `<div><img class="detail-image" src="${esc(image)}" alt="${esc(title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><p class="detail-image-status" role="status" aria-live="polite" hidden>사진을 불러오지 못했습니다.</p></div>`
    : `<p class="detail-image-status" role="status">기사에서 사용할 수 있는 사진을 확인하지 못했습니다.</p>`;
  const sourceLinks=resolvedSources.map((row)=>`<a href="${esc(row.url)}" rel="noopener noreferrer">${esc(row.sourceLabel)} ${row.relay?"중계 링크 열기":"원문 보기"} ↗</a>`);
  const points=[
    ["왜 중요한가",copy.whyImportant||issue.whyImportant],
    ["새로 달라진 점",copy.change||issue.changedSincePrevious],
    ["다음 확인",copy.watchNext]
  ].filter(([,value])=>String(value||"").trim());
  $("detailContent").innerHTML=`
    <h2 id="detailTitle">${esc(title)}</h2>
    ${imageHtml}
    <section class="detail-section"><h3>기사 요약</h3><div class="detail-summary">${publishedHtml}<p class="detail-basis">${esc(basis)}</p>${summaryHtml}</div></section>
    ${todayAdHtml(issue,index,"today-detail")}
    <section class="detail-section"><h3>브리핑 포인트</h3><dl class="detail-points">${points.map(([label,value])=>`<div class="detail-point"><dt>${esc(label)}</dt><dd>${esc(value)}</dd></div>`).join("")}</dl></section>
    ${sourceLinks.length?`<section class="detail-section"><h3>출처</h3>${sourceTranslationHtml(issue,resolvedSources)}<nav class="detail-originals" aria-label="출처 링크">${sourceLinks.join("")}</nav></section>`:""}`;
  $("detailClose").focus();
  $("issueDetail").querySelector(".detail-panel").scrollTop=entry?.detailScroll||0;
}

function focusTrap(event){
  const overlay=$("issueDetail");
  if(!overlay.classList.contains("open")||event.key!=="Tab")return;
  const focusable=[...overlay.querySelectorAll("button,a,[tabindex]:not([tabindex='-1'])")].filter((element)=>!element.disabled&&!element.hidden&&element.offsetParent!==null);
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}
document.addEventListener("keydown",(event)=>{if(event.key==="Escape")closeIssueDetail();else focusTrap(event)});

function renderRail(edition){
  const fixture=edition.candidateContract?.metrics||{};
  const change=edition.continuityProjection||edition.editionChange||{};
  const changeCounts=change.counts||{};
  const changeMetrics=(changeCounts.baseline??0)>0
    ? `<dt>첫 저장 기준선</dt><dd>${changeCounts.baseline}건</dd>`
    : `<dt>새 사건</dt><dd>${changeCounts.new??0}건</dd><dt>실질 변화</dt><dd>${changeCounts.material_update??0}건</dd>`;
  const fulfillment=edition.categoryFulfillment;
  const personalization=edition.personalization||null;
  const personalizationMetric=personalization
    ? `<dt>편성 기준</dt><dd>${personalization.mode==="bounded_category_affinity_reorder"?"개인 순서":"공유 중요도"}</dd>`
    : "";
  const fulfillmentMetric=fulfillment
    ? `<dt>선택 분야 충족</dt><dd>${fulfillment.metCount}/${fulfillment.selectedCount}</dd>`
    : "";
  const servingMetric=edition.serving
    ? `<dt>제공 상태</dt><dd>${edition.serving.fallback?"검증 이전판":"현재판 검증"}</dd>`
    : "";
  $("metrics").innerHTML=`
    ${servingMetric}
    <dt>편집 이슈</dt><dd>${edition.issues.length}건</dd>
    ${fulfillmentMetric}
    ${personalizationMetric}
    ${changeMetrics}
    <dt>반복 보류</dt><dd>${change.heldRepeatCount??0}건</dd>
    <dt>편집 후보</dt><dd>${fixture.candidateCount??0}건</dd>
    <dt>관측 출처</dt><dd>${edition.sourceCount}곳</dd>
    <dt>해외 흐름</dt><dd>${edition.overseasShare}%</dd>
    <dt>새 LLM 호출</dt><dd>${edition.llmCalls}회</dd>`;
  const counts=new Map();
  for(const issue of edition.issues) for(const category of issue.selectedByCategories?.length?issue.selectedByCategories:issue.categoryIds||[]) counts.set(category,(counts.get(category)||0)+1);
  const categoryIssueLimit=Number(edition.selection.categoryIssueLimit)||Infinity;
  const fulfillmentRows=new Map((fulfillment?.rows||[]).map((row)=>[row.categoryId,row]));
  $("selection").innerHTML=edition.selection.categories.map((category)=>{
    const row=fulfillmentRows.get(category.id);
    const issueCount=Math.min(counts.get(category.id)||0,categoryIssueLimit);
    const value=row?.state==="no_supply"?"공급 없음":row?.state==="no_qualified_supply"?"기계 유효 후보 없음":row?.state==="underfilled"?`${row.issueCount}/${row.target} 보강 중`:`${issueCount}개 이슈`;
    return `<li><span>${esc(category.label)}</span><b>${esc(value)}</b></li>`;
  }).join("");
}

function render(edition){
  const requestedSlot=edition.serving?.requestedSlotId||edition.slot.id;
  const requestedDate=edition.serving?.requestedDate||edition.editionDate||kstDate(edition.generatedAt);
  const slotLabel={morning:"모닝",lunch:"런치",evening:"이브닝"};
  const requestedCategories=edition.requestedCategories&&edition.requestedCategories.length
    ? [...edition.requestedCategories]
    : edition.selection.categories.map((category)=>category.id);
  state.edition=edition;state.categories=requestedCategories;state.confirmedCategories=[...requestedCategories];state.slot=requestedSlot;state.editionDate=requestedDate;
  // 폴백 고지는 generatedAt이 아니라 **serving 영수증(servedDate·servedSlotId)**
  // 기준으로 말한다 (David 확정 지시 2026-08-13): 제공된 실제 날짜·슬롯·
  // "최신판 아님"이 화면에서 명확해야 한다. 예: "8월 12일 이브닝판을
  // 보여드리고 있습니다."
  const servedSlotId=edition.serving?.servedSlotId||edition.slot.id;
  // 형식 검증 없이 Intl.format에 넣으면 Invalid Date에서 RangeError로 렌더
  // 전체가 죽는다(검수 P2) — YYYY-MM-DD일 때만 라벨을 만든다.
  const servedDateLabel=/^\d{4}-\d{2}-\d{2}$/.test(edition.serving?.servedDate||"")
    ? new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"long",day:"numeric",weekday:"short"})
        .format(new Date(`${edition.serving.servedDate}T00:00:00+09:00`))
    : null;
  $("dateLine").textContent=edition.serving?.fallback
    ? `${servedDateLabel?servedDateLabel+" ":""}${slotLabel[servedSlotId]||edition.slot.label}판을 보여드리고 있습니다 · 최신 ${slotLabel[requestedSlot]||"새"}판은 검수 중`
    : `${servedDateLabel?servedDateLabel+" · ":""}${slotLabel[servedSlotId]||edition.slot.label}판`;
  $("editionTitle").textContent=edition.serving?.fallback?`검증된 ${edition.slot.label} 브리핑`:`${edition.slot.label} 오늘판`;
  const choice=edition.selection.categories.map((category)=>category.label).join(" · ");
  const fulfillment=edition.categoryFulfillment;
  if(edition.serving?.fallback){
    $("editionLead").textContent=`새 ${slotLabel[requestedSlot]||"다음"}판이 검수 기준을 통과할 때까지 ${choice}의 가장 최근 검증판을 보여드립니다.`;
  }else if(edition.partial&&Array.isArray(edition.withheldCategories)&&edition.withheldCategories.length){
    // S3b 부분 서빙 — 제외 분야를 조용히 숨기지 않는다. 사유 문구는 서버가
    // 만든 그대로(미래 보장 표현 없음, David 확정 지시 2026-08-13).
    $("editionLead").textContent=`${choice}에서 ${edition.issues.length}개 흐름을 직접 정리했습니다. `+
      edition.withheldCategories.map((w)=>w.reason).join(" ");
  }else if(fulfillment&&!fulfillment.goalSatisfied){
    const gaps=fulfillment.rows.filter((row)=>row.state!=="met").map((row)=>row.label).join(" · ");
    $("editionLead").textContent=`${choice} 중 ${fulfillment.metCount}/${fulfillment.selectedCount}개 분야에서 ${edition.issues.length}개 흐름을 정리했습니다. ${gaps||"일부 분야"}는 검증 가능한 재료를 보강 중입니다.`;
  }else{
    $("editionLead").textContent=`${choice}에서 지금 확인할 ${edition.issues.length}개 흐름을 직접 정리했습니다.`;
  }
  const kstHour=Number(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",hour:"2-digit",hourCycle:"h23"}).format(new Date()));
  const today=kstDate(new Date());
  const editionDate=requestedDate;
  $("editionDate").value=editionDate;
  $("editionDate").max=today;
  for(const button of $("slots").querySelectorAll("button")){
    const active=button.dataset.slot===requestedSlot;button.classList.toggle("active",active);button.setAttribute("aria-selected",String(active));
    const hour={morning:7,lunch:12,evening:19}[button.dataset.slot];
    button.disabled=editionDate>today||(editionDate===today&&hour>kstHour);
  }
  renderCategories(edition);renderIssues(edition);renderRail(edition);
}

function renderError(error){
  state.edition=null;
  if(error.code==="EDITORIAL_EDITION_NOT_SERVEABLE"){
    const serving=error.body?.serving||{};
    const availableCategories=Array.isArray(serving.availableCategories)?serving.availableCategories:[];
    const selectedIds=Array.isArray(serving.selectedCategories)?serving.selectedCategories:[];
    const selectedCategories=selectedIds.map((id)=>availableCategories.find((category)=>category.id===id)||{id,label:id});
    if(selectedCategories.length&&availableCategories.length){
      state.categories=selectedIds;state.confirmedCategories=[...selectedIds];
      state.slot=serving.requestedSlotId||state.slot;
      state.editionDate=serving.requestedDate||state.editionDate;
      renderCategories({
        selection:{categories:selectedCategories,mode:"saved"},
        availableCategories,
        categoryFulfillment:serving.fulfillment||null
      });
      $("selection").innerHTML=selectedCategories.map((category)=>`<li><span>${esc(category.label)}</span><b>검수 중</b></li>`).join("");
      for(const button of $("slots").querySelectorAll("button")){
        const active=button.dataset.slot===state.slot;
        button.classList.toggle("active",active);
        button.setAttribute("aria-selected",String(active));
      }
    }else{
      $("categoryStatus").textContent="검증 완료 대기";
      $("selection").innerHTML=`<li><span>선택 분야</span><b>검수 중</b></li>`;
    }
    $("dateLine").textContent="검수 완료 대기";
    $("editionTitle").textContent="새 브리핑을 검수 중입니다";
    $("editionLead").textContent="기준을 통과한 내용만 보여드리기 위해 현재판을 다시 확인하고 있습니다.";
    $("metrics").innerHTML=`<dt>상태</dt><dd>검수 보류</dd><dt>이전 검증판</dt><dd>없음</dd>`;
    $("issues").innerHTML=`<div class="empty"><h2>아직 보여드릴 검증판이 없습니다</h2><p>현재판과 최근 24시간의 이전판이 모두 제공 기준을 통과하지 못했습니다.</p><button class="retry" type="button" title="다시 확인" aria-label="다시 확인">↻</button></div>`;
    $("issues").querySelector("button").onclick=()=>loadEdition(true,state.editionDate);
    return;
  }
  $("dateLine").textContent=`${state.editionDate||kstDate(new Date())} · 요청한 판 불러오기 실패`;
  $("editionTitle").textContent="오늘판을 불러오지 못했습니다";
  $("editionLead").textContent="다시 시도하거나 다른 날짜·시간대를 선택해 주세요.";
  $("metrics").innerHTML="<dt>제공 상태</dt><dd>불러오기 실패</dd>";
  for(const button of $("slots").querySelectorAll("button")){
    const active=button.dataset.slot===state.slot;
    button.classList.toggle("active",active);button.setAttribute("aria-selected",String(active));
  }
  $("issues").innerHTML=`<div class="error"><h2>오늘판을 불러오지 못했습니다</h2><p>${esc(error.message)}</p><button class="retry" type="button" title="다시 시도" aria-label="다시 시도">↻</button></div>`;
  $("issues").querySelector("button").onclick=()=>loadEdition(true,state.editionDate);
}

async function loadEdition(announce=false,targetDate=null,categories=state.categories){
  state.loadController?.abort();
  const loadController=new AbortController();
  state.loadController=loadController;
  const loadRevision=++state.loadRevision;
  $("refresh").setAttribute("aria-busy","true");
  try{
    const query=new URLSearchParams();
    if(state.userId)query.set("userId",state.userId);
    if(categories&&categories.length)query.set("categories",categories.join(","));
    if(state.slot)query.set("slot",state.slot);
    if(targetDate)query.set("date",targetDate);
    const edition=await json(`/api/today?${query}`,{signal:loadController.signal});
    if(loadRevision!==state.loadRevision)return;
    render(edition);
    if(!restoreTodayDetail())todayHistory.ensure(todaySnapshot());
    saveTodayNavigation();
    if(announce)toast("오늘판을 새로 정리했습니다");
  }catch(error){if(error.name!=="AbortError"&&loadRevision===state.loadRevision)renderError(error)}finally{
    if(loadRevision===state.loadRevision)$("refresh").setAttribute("aria-busy","false");
  }
}

function toggleCategory(category){
  const next=new Set(state.categories||[]);
  if(next.has(category)){if(next.size===1){toast("관심 분야를 하나 이상 남겨주세요");return}next.delete(category)}else next.add(category);
  state.categories=[...next];
  const categories=[...state.categories];
  const revision=++state.categoryRevision;
  state.loadController?.abort();
  state.loadRevision+=1;
  for(const button of $("categories").querySelectorAll("button"))button.setAttribute("aria-pressed",String(next.has(button.dataset.category)));
  $("categoryStatus").textContent=`${next.size}개 선택 · 불러오는 중`;
  state.categoryQueue=state.categoryQueue.then(async()=>{
    if(revision!==state.categoryRevision)return;
    await json("/api/today/categories",{
      method:"POST",
      body:JSON.stringify({userId:state.userId,categories}),
      signal:AbortSignal.timeout(10000)
    });
    state.confirmedCategories=[...categories];
    if(revision!==state.categoryRevision)return;
    state.categories=categories;
    await loadEdition(false,state.editionDate,categories);
  }).catch((error)=>{
    if(revision!==state.categoryRevision)return;
    state.categories=[...(state.confirmedCategories||[])];
    if(state.edition)renderCategories({...state.edition,requestedCategories:state.categories});
    $("refresh").setAttribute("aria-busy","false");toast(error.message);
  });
}

$("editionDate").onchange=(event)=>{state.pinnedEdition=true;state.editionDate=event.currentTarget.value;loadEdition(false,event.currentTarget.value)};

function setupViewSwitch(){
  const nav=document.querySelector("[data-view-switch]");
  if(!nav)return;
  for(const link of nav.querySelectorAll("a[data-view]"))link.addEventListener("click",(event)=>{
    if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const target=link.dataset.view;
    if(target===nav.dataset.active||nav.dataset.switching){event.preventDefault();return}
    event.preventDefault();
    nav.dataset.switching="true";
    nav.dataset.target=target;
    const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(()=>location.assign(link.href),reduced?0:210);
  });
}

    const saved=localStorage.getItem("feed_uid");
    const isNewVisitor=!saved;

      json("/api/session",{method:"POST",body:JSON.stringify({userId:saved})}),
      json("/api/config").catch(()=>({}))
    ]);
    state.coupang=config.coupang||null;

    if(Array.isArray(session.briefingCategories)&&session.briefingCategories.length){state.categories=session.briefingCategories;state.confirmedCategories=[...session.briefingCategories]}
    const snapshot=todayHistory.snapshot();
    const returning=performance.getEntriesByType("navigation")[0]?.type==="back_forward";
    if(snapshot?.userId===state.userId && snapshot.edition

      && (state.pinnedEdition||snapshot.pinnedEdition||issueDetailFromHash()||returning)){
      state.pinnedEdition=state.pinnedEdition||Boolean(snapshot.pinnedEdition);
      render(snapshot.edition);state.listScrollY=snapshot.y||0;window.scrollTo(0,state.listScrollY);
      restoreTodayDetail();
    }else await loadEdition(false,state.editionDate);
    NowHotNoticeGuide.show({release:config.release,isNewVisitor,skip:Boolean(issueDetailFromHash())});
  }catch(error){renderError(error)}
})();
</script>
