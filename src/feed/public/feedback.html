<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>개선 요청 — 지금핫</title>
<script>
try { const theme=localStorage.getItem("feed_theme")||"system"; document.documentElement.dataset.theme=theme==="system"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):theme; } catch {}
</script>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--paper:#fff;--ink:#15171c;--sub:#626873;--line:#d9dde4;--blue:#2457d6}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1014;--paper:#15181e;--ink:#f2f4f7;--sub:#9ca3af;--line:#303641;--blue:#7ca0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:auto;padding:30px 20px 70px}a{color:var(--blue)}h1{font-size:26px;margin:24px 0 8px}p{margin:10px 0 22px}.muted{color:var(--sub);font-size:14px}
label{display:block;font-weight:700;margin:20px 0 7px}select,textarea,button{font:inherit;color:inherit}select,textarea{width:100%;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:6px}textarea{min-height:210px;resize:vertical}
button{border:0;border-radius:6px;min-height:46px;padding:10px 20px;background:var(--blue);color:var(--paper);font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}#status{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <a href="/">← 지금핫으로 돌아가기</a>
  <h1>개선 요청</h1>
  <p class="muted">불편했던 점이나 바라는 기능을 알려주세요. 보낸 내용은 운영자만 확인합니다.</p>
  <form id="requestForm">
    <label for="kind">어떤 의견인가요?</label>
    <select id="kind" required><option value="suggestion">개선 제안</option><option value="bug">오류 신고</option><option value="other">기타</option></select>
    <label for="message">내용</label>
    <textarea id="message" required minlength="5" maxlength="2000" placeholder="어느 화면에서 무엇이 불편했는지 알려주세요." aria-describedby="messageHelp"></textarea>
    <p id="messageHelp" class="muted">5~2,000자 · 하루 최대 5건. 이름이나 연락처는 적지 않아도 됩니다.</p>
    <button id="submit" type="submit">요청 보내기</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <button id="again" type="button" hidden>다른 의견 보내기</button>
  <p class="muted"><a href="/about#updates">업데이트 기록</a> · <a href="/privacy">개인정보처리방침</a></p>
</main>
<script>
const form=document.getElementById("requestForm"), kind=document.getElementById("kind"), message=document.getElementById("message"), submit=document.getElementById("submit"), status=document.getElementById("status"), again=document.getElementById("again");
let pending=null, accepted=false, busy=false, userId=null;
async function post(path,body){
  const response=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"보내지 못했어요. 잠시 후 다시 시도해 주세요.");
  return data;
}
form.onsubmit=async(event)=>{
  event.preventDefault(); if(busy||accepted)return;
  const content=message.value.trim();
  if(content.length<5){status.textContent="내용을 5자 이상 입력해 주세요.";message.focus();return;}
  const payload={kind:kind.value,message:content};
  if(!pending||pending.kind!==payload.kind||pending.message!==payload.message)pending={...payload,requestId:crypto.randomUUID()};
  busy=true; submit.disabled=kind.disabled=message.disabled=true;status.textContent="접수 중…";
  try{
    if(!userId){
      let saved=null;try{saved=localStorage.getItem("feed_uid");}catch{}
      const session=await post("/api/session",{userId:saved});userId=session.userId;
      try{localStorage.setItem("feed_uid",userId);}catch{}
    }
    const receipt=await post("/api/feedback",{userId,...pending});
    if(receipt.ok!==true||!receipt.id)throw new Error("접수 여부를 확인하지 못했어요. 다시 보내 주세요.");
    accepted=true;status.textContent="접수되었습니다. 의견을 보내주셔서 감사합니다.\n요청 번호: "+receipt.id;again.hidden=false;
  }catch(error){status.textContent=error.message||"연결을 확인한 뒤 다시 보내 주세요.";}
  finally{busy=false;submit.disabled=kind.disabled=message.disabled=accepted;}
};
again.onclick=()=>{form.reset();pending=null;accepted=false;submit.disabled=kind.disabled=message.disabled=false;again.hidden=true;status.textContent="";message.focus();};
</script>
</body>
</html>
